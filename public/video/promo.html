<style>
/* ==========================================================================
   stage.css : la composition 1080 × 1920 (noir et vert, relief, profondeur).
   Palette stricte : #050807 #0E1512 #1FE07A #0F5132 #F2F5F3 (+ transparences).
   ========================================================================== */
:root {
  --bg: #050807;
  --card: #0E1512;
  --accent: #1FE07A;
  --forest: #0F5132;
  --text: #F2F5F3;
}

.stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 820px;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-weight: 400;
  transform-origin: 0 0;
  perspective: 960px; /* 1600 × échelle 0,6 */
  perspective-origin: 50% 50%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
  font-kerning: normal;
  contain: strict;
  user-select: none;
  -webkit-user-select: none;
}
.stage * { box-sizing: border-box; }
.stage .layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 820px;
  pointer-events: none;
}
.stage .world,
.stage .scene {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1920px;
  transform-style: preserve-3d;
}
.stage .scene { display: none; }
/* Composition d'origine (1080 × 1920) projetée au centre du cadre 21:9 */
.stage .world {
  transform-origin: 0 0;
  transform: translate3d(636px, -119.8px, 0) scale3d(0.6, 0.6, 0.6);
}
.stage .p3 { transform-style: preserve-3d; }
.stage .abs { position: absolute; }
.stage .center-x { left: 0; width: 1080px; text-align: center; }

/* ---------- Typographie ---------- */
.stage .t-title {
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.02;
  color: var(--text);
  white-space: nowrap;
  /* extrusion discrète + ombre douce */
  text-shadow:
    0 1px 0 rgba(15, 81, 50, 1),
    0 2px 0 rgba(15, 81, 50, 0.96),
    0 3px 0 rgba(15, 81, 50, 0.9),
    0 4px 0 rgba(15, 81, 50, 0.84),
    0 5px 0 rgba(15, 81, 50, 0.78),
    0 6px 0 rgba(15, 81, 50, 0.7),
    0 7px 0 rgba(15, 81, 50, 0.62),
    0 14px 24px rgba(5, 8, 7, 0.92),
    0 0 42px rgba(31, 224, 122, 0.12);
}
.stage .t-accent {
  color: var(--accent);
  text-shadow:
    0 1px 0 rgba(15, 81, 50, 1),
    0 2px 0 rgba(15, 81, 50, 0.96),
    0 3px 0 rgba(15, 81, 50, 0.9),
    0 4px 0 rgba(15, 81, 50, 0.84),
    0 5px 0 rgba(15, 81, 50, 0.78),
    0 6px 0 rgba(15, 81, 50, 0.7),
    0 7px 0 rgba(15, 81, 50, 0.62),
    0 14px 24px rgba(5, 8, 7, 0.92),
    0 0 34px rgba(31, 224, 122, 0.45);
}
.stage .t-light {
  font-weight: 300;
  color: rgba(242, 245, 243, 0.72);
  letter-spacing: -0.005em;
  line-height: 1.32;
}
.stage .word {
  display: inline-block;
  transform-origin: 50% 100%;
  backface-visibility: hidden;
}
.stage .tnum { font-variant-numeric: tabular-nums; }

/* ---------- Carte 3D : épaisseur, biseau, reflet d'arête, ombre ---------- */
.stage .card3d {
  position: absolute;
  border-radius: 30px;
  background:
    linear-gradient(162deg, rgba(31, 224, 122, 0.11) 0%, rgba(14, 21, 18, 0) 32%),
    linear-gradient(180deg, rgba(14, 21, 18, 0.97) 0%, rgba(14, 21, 18, 0.97) 62%, rgba(5, 8, 7, 0.98) 100%);
  border: 1.5px solid rgba(31, 224, 122, calc(0.22 + var(--glow, 0) * 0.6));
  box-shadow:
    inset 0 1.5px 0 rgba(242, 245, 243, 0.22),
    inset 0 -26px 46px rgba(5, 8, 7, 0.5),
    0 2px 0 rgba(15, 81, 50, 1),
    0 4px 0 rgba(15, 81, 50, 0.93),

  align-items: center;
  gap: 0;
  cursor: pointer;
  touch-action: none;

.pl-seg:nth-last-child(2) { border-radius: 0 3px 3px 0; }
.pl-bar:hover .pl-seg, .pl-bar.drag .pl-seg { height: 8px; }
.pl-seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #1FE07A; box-shadow: 0 0 8px rgba(31, 224, 122, 0.7); }
.pl-knob {

  top: 50%;
  width: 16px;
  height: 16px;
  margin: -8px 0 0 -8px;
  border-radius: 50%;

.pl-chaps::-webkit-scrollbar { display: none; }

  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid rgba(31, 224, 122, 0.16);
  background: rgba(14, 21, 18, 0.8);

  white-space: nowrap;
  text-align: left;
}

.pl-chap.on { border-color: #1FE07A; background: rgba(31, 224, 122, 0.12); box-shadow: 0 0 16px rgba(31, 224, 122, 0.2); }

  right: 0;
  bottom: 0;

  padding-right: max(14px, env(safe-area-inset-right));
  background: linear-gradient(180deg, rgba(5, 8, 7, 0), rgba(5, 8, 7, 0.78) 45%, rgba(5, 8, 7, 0.92));
}
.player.compact .pl-chaps { display: none; }
.player.compact.sheet .pl-chaps { display: flex; flex-wrap: wrap; }
.player.compact.idle .pl-ctrl { opacity: 0; transform: translateY(16px); pointer-events: none; }
.player.compact.idle .pl-frame { cursor: none; }

/* ---------- Téléphone (paysage) : vidéo sur toute la hauteur, contrôles sur le côté ---------- */
.player.landscape { grid-template-columns: minmax(0, 1fr) minmax(240px, 330px); grid-template-rows: minmax(0, 1fr); }
.player.landscape .pl-listbtn, .player.wide .pl-listbtn { display: none; }
.player.landscape .pl-time { min-width: 0; }
.player.landscape .pl-ctrl {
  grid-column: 2;
  grid-row: 1;
  justify-content: center;

  border-left: 1px solid rgba(31, 224, 122, 0.12);
}
.player.landscape .pl-chaps { flex-direction: column; overflow-y: auto; max-height: 40vh; }

.player.wide { grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr) auto; }

<script>
/* ==========================================================================
   IBFautomate — vidéo promo 40 s
   core.js : format, tempo, grille des coupes, palette, easing, outils DOM.
   Tout est calculé à partir du temps t (secondes) : même image en lecture,
   en navigation et à l'export.
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});

  /* ---------- Format ---------- */
  IBF.W = 1920; // format large 21:9 (1920 × 820)
  IBF.H = 820;
  // La composition d'origine (1080 × 1920) est conservée telle quelle, puis projetée
  // au centre du cadre large : échelle s, point (540, 883) placé au centre du cadre.
  (function () {
    const s = 0.6, tx = IBF.W / 2 - 540 * s, ty = IBF.H / 2 - 883 * s;
    IBF.FIT = { s, tx, ty, x0: -tx / s, x1: (IBF.W - tx) / s, y0: -ty / s, y1: (IBF.H - ty) / s };
    IBF.FIT.w = IBF.FIT.x1 - IBF.FIT.x0;
    IBF.FIT.h = IBF.FIT.y1 - IBF.FIT.y0;
  })();
  IBF.FPS = 30;
  IBF.DURATION = 40;
  IBF.FRAMES = IBF.FPS * IBF.DURATION; // 1200 images

  /* ---------- Tempo : 92 BPM ---------- */
  IBF.BPM = 92;
  IBF.BEAT = 60 / IBF.BPM; // 0,652 s
  IBF.beat = (n) => n * IBF.BEAT;
  // Les mesures démarrent sur le temps n°1 (levée d'un temps) : 0,652 s + k × 2,609 s
  IBF.bar = (k) => IBF.beat(1 + 4 * k);

  /* ---------- Coupes : calées sur le temps le plus proche du brief ---------- */
  const cutBeats = [0, 6, 11, 18, 26, 34, 41, 49, 52, 57];
  const cuts = cutBeats.map((b) => b * IBF.BEAT);
  cuts.push(IBF.DURATION);
  IBF.CUTS = cuts;

  const names = [
    ['accroche', 'Accroche'],
    ['logo', 'Logo'],
    ['promesse', 'Promesse'],
    ['constat', 'Le constat'],
    ['services', 'Nos services'],
    ['dashboard', 'Tableau de bord'],
    ['temoignage', 'Témoignage'],
    ['transition', 'Transition'],
    ['processus', 'Processus'],
    ['cta', "Appel à l’action"]
  ];
  IBF.SCENES = names.map((n, i) => ({ id: n[0], name: n[1], index: i, start: cuts[i], end: cuts[i + 1] }));

  /* ---------- Palette : 5 couleurs, rien d'autre ---------- */
  IBF.C = {
    bg: '#050807',
    card: '#0E1512',
    accent: '#1FE07A',
    forest: '#0F5132',
    text: '#F2F5F3'
  };
  IBF.RGB = {
    bg: [5, 8, 7],
    card: [14, 21, 18],
    accent: [31, 224, 122],
    forest: [15, 81, 50],
    text: [242, 245, 243]
  };
  IBF.rgba = (name, a) => {
    const c = IBF.RGB[name];
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (+Math.max(0, Math.min(1, a)).toFixed(4)) + ')';
  };

  /* ---------- Maths ---------- */
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, p) => a + (b - a) * p;
  IBF.clamp = clamp;
  IBF.lerp = lerp;
  IBF.seg = (t, t0, dur) => clamp((t - t0) / dur);
  IBF.smooth = (a, b, x) => {
    const p = clamp((x - a) / (b - a));
    return p * p * (3 - 2 * p);
  };
  IBF.fix = (v, d = 2) => +v.toFixed(d);

  /* ---------- Easing : cubic-bezier(0.22, 1, 0.36, 1) ---------- */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (u) => ((ax * u + bx) * u + cx) * u;
    const sy = (u) => ((ay * u + by) * u + cy) * u;
    const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
    function solve(x) {
      let u = x;
      for (let i = 0; i < 8; i++) {
        const e = sx(u) - x;
        if (Math.abs(e) < 1e-7) return u;
        const d = dx(u);
        if (Math.abs(d) < 1e-7) break;
        u -= e / d;
      }
      let lo = 0, hi = 1;
      u = x;
      for (let i = 0; i < 50; i++) {
        const v = sx(u);
        if (Math.abs(v - x) < 1e-7) break;
        if (v < x) lo = u; else hi = u;
        u = (lo + hi) / 2;
      }
      return u;
    }
    return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : sy(solve(x)));
  }
  IBF.bezier = bezier;
  IBF.ease = bezier(0.22, 1, 0.36, 1); // courbe principale du brief
  IBF.easeInOut = bezier(0.65, 0, 0.35, 1);
  IBF.easeIn = bezier(0.55, 0, 0.9, 0.3);
  IBF.easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
  IBF.easeInCubic = (x) => Math.pow(clamp(x), 3);
  IBF.easeInOutCubic = (x) => {
    x = clamp(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  // progression easée d'une animation qui commence à t0 et dure dur
  IBF.ep = (t, t0, dur, fn) => (fn || IBF.ease)(IBF.seg(t, t0, dur));

  /* ---------- Aléatoire déterministe ---------- */
  IBF.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  // bruit lisse 1D déterministe (pour dérives lentes)
  IBF.noise1 = function (x, seed = 0) {
    const h = (n) => {
      const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    const i = Math.floor(x), f = x - i;
    const u = f * f * (3 - 2 * f);
    return lerp(h(i), h(i + 1), u) * 2 - 1;
  };

  /* ---------- DOM ---------- */
  // crée un élément (avec cache de styles pour n'écrire que ce qui change)
  IBF.el = function (tag, cls, parent, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    e._s = {};
    return e;
  };
  IBF.svgEl = function (tag, attrs, parent) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    e._s = {};
    return e;
  };
  IBF.html = function (str) {
    const d = document.createElement('div');
    d.innerHTML = str.trim();
    return d.firstElementChild;
  };
  // écriture de style avec cache
  IBF.S = function (e, k, v) {
    const c = e._s || (e._s = {});
    if (c[k] !== v) {
      c[k] = v;
      e.style[k] = v;
    }
  };
  // variable CSS avec cache
  IBF.V = function (e, k, v) {
    const c = e._s || (e._s = {});
    const key = 'var' + k;
    if (c[key] !== v) {
      c[key] = v;
      e.style.setProperty(k, v);
    }
  };
  // attribut avec cache
  IBF.A = function (e, k, v) {
    const c = e._s || (e._s = {});
    const key = 'attr' + k;
    if (c[key] !== v) {
      c[key] = v;
      e.setAttribute(k, v);
    }
  };
  IBF.show = function (e, on) {
    IBF.S(e, 'display', on ? '' : 'none');
  };

  /* ---------- Styles d'animation réutilisables ---------- */
  // Entrée « qui monte depuis la profondeur » (mots, cartes)
  IBF.rise = function (e, p, o) {
    o = o || {};
    const q = 1 - p;
    const dy = o.dy != null ? o.dy : 60;
    const dz = o.dz != null ? o.dz : -220;
    const rx = o.rx != null ? o.rx : 70;
    const blur = o.blur != null ? o.blur : 8;
    const base = o.base || '';
    IBF.S(
      e,
      'transform',
      base +
        'translate3d(0,' + (q * dy).toFixed(2) + 'px,' + (q * dz).toFixed(2) + 'px) rotateX(' + (q * rx).toFixed(2) + 'deg)'
    );
    IBF.S(e, 'opacity', String(IBF.fix(Math.min(1, p * 1.6), 3)));
    IBF.S(e, 'filter', blur && q > 0.002 ? 'blur(' + (q * blur).toFixed(2) + 'px)' : 'none');
  };

  // formatage
  IBF.nbsp = ' ';
  IBF.fmtInt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
})();

<script>
/* ==========================================================================
   logo.js : monogramme « IBF » original (géométrie dessinée ici) + symbole de
   flux niché dans le F. Version 3D : extrusion par couches, biseau émeraude,
   reflet mobile.
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  const C = IBF.C;

  // Boîte du monogramme : 532 × 360 (unités SVG), épaisseur de trait 64
  const I_PATH = 'M14 0H50A14 14 0 0 1 64 14V346A14 14 0 0 1 50 360H14A14 14 0 0 1 0 346V14A14 14 0 0 1 14 0Z';
  const B_OUT = 'M110 0H198A84 84 0 0 1 198 168H212A96 96 0 0 1 212 360H110A14 14 0 0 1 96 346V14A14 14 0 0 1 110 0Z';
  const B_IN1 = 'M160 56H196A28 28 0 0 1 196 112H160Z';
  const B_IN2 = 'M160 224H210A40 40 0 0 1 210 304H160Z';
  const F_PATH = 'M356 0H518A14 14 0 0 1 532 14V50A14 14 0 0 1 518 64H406V150H474A14 14 0 0 1 488 164V196A14 14 0 0 1 474 210H406V346A14 14 0 0 1 392 360H356A14 14 0 0 1 342 346V14A14 14 0 0 1 356 0Z';
  const MONO = I_PATH + B_OUT + B_IN1 + B_IN2 + F_PATH;
  // Symbole de flux : 3 nœuds reliés, niché sous le bras du F (chevron vers l'avant)
  const FB = [
    [438, 468, 486, 486, 258, 258, 272, 296],
    [486, 486, 468, 442, 296, 320, 336, 336]
  ];
  const FLOW_D = 'M438 258C468 258 486 272 486 296C486 320 468 336 442 336';
  const NODES = [
    [438, 258],
    [486, 296],
    [442, 336]
  ];

  IBF.LOGO = { w: 532, h: 360, vw: 552, vh: 380, cx: 266, mono: MONO, flow: FLOW_D, nodes: NODES };

  // Path2D utilisable par les canvas (échantillonnage des particules)
  IBF.logoPath2D = function () {
    return new Path2D(MONO);
  };

  let uid = 0;

  /**
   * Construit un logo 3D.
   * o.size   : hauteur affichée (px)
   * o.layers : nombre de couches d'extrusion
   * o.depth  : épaisseur totale (px)
   */
  IBF.buildLogo = function (parent, o) {
    o = o || {};
    const id = 'lg' + uid++;
    const size = o.size || 400;
    const k = size / 360;
    const vw = IBF.LOGO.vw, vh = IBF.LOGO.vh; // marge pour le trait
    const w = vw * k, h = vh * k;
    const N = o.layers || 16;
    const depth = o.depth || 40;

    const root = IBF.el('div', 'logo3d p3', parent);
    root.style.width = w + 'px';
    root.style.height = h + 'px';

    const vb = '-10 -10 ' + vw + ' ' + vh;
    const layers = [];
    // Couches d'extrusion : de l'arrière vers l'avant
    for (let i = N; i >= 1; i--) {
      const L = IBF.el('div', 'logo-layer', root);
      const f = i / N;
      // arête avant éclairée (vert vif), flancs vert forêt qui s'assombrissent vers l'arrière
      const col =
        i === 1 ? IBF.rgba('accent', 0.75) : i === 2 ? IBF.rgba('accent', 0.35) : IBF.rgba('forest', 1 - f * 0.5);
      L.innerHTML =
        '<svg viewBox="' + vb + '" width="' + w + '" height="' + h + '"><path d="' + MONO +
        '" fill-rule="evenodd" fill="' + col + '" stroke="' + col + '" stroke-width="5" stroke-linejoin="round"/></svg>';
      L.style.transform = 'translateZ(' + (-(i / N) * depth).toFixed(2) + 'px)';
      layers.push(L);
    }

    // Face avant : noir brillant + biseau émeraude + reflet
    const face = IBF.el('div', 'logo-layer logo-face', root);
    face.innerHTML =
      '<svg viewBox="' + vb + '" width="' + w + '" height="' + h + '">' +
      '<defs>' +
      '<linearGradient id="' + id + 'f" x1="0" y1="0" x2="0.35" y2="1">' +
      '<stop offset="0" stop-color="' + C.card + '"/><stop offset="0.6" stop-color="' + C.bg + '"/><stop offset="1" stop-color="' + C.bg + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'e" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + C.accent + '"/><stop offset="0.55" stop-color="' + C.accent + '" stop-opacity="0.8"/><stop offset="1" stop-color="' + C.forest + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'g" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + C.text + '" stop-opacity="0.16"/><stop offset="0.46" stop-color="' + C.text + '" stop-opacity="0.03"/><stop offset="0.47" stop-color="' + C.text + '" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="' + id + 's" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="-160" y2="360">' +
      '<stop offset="0" stop-color="' + C.text + '" stop-opacity="0"/><stop offset="0.5" stop-color="' + C.text + '" stop-opacity="0.55"/><stop offset="1" stop-color="' + C.text + '" stop-opacity="0"/></linearGradient>' +
      '</defs>' +
      '<path d="' + MONO + '" fill-rule="evenodd" fill="url(#' + id + 'f)"/>' +
      '<path d="' + MONO + '" fill-rule="evenodd" fill="url(#' + id + 'g)"/>' +
      '<path class="lg-sheen" d="' + MONO + '" fill-rule="evenodd" fill="url(#' + id + 's)"/>' +
      '<path d="' + MONO + '" fill="none" stroke="url(#' + id + 'e)" stroke-width="5" stroke-linejoin="round"/>' +
      '<path d="' + MONO + '" fill="none" stroke="' + C.text + '" stroke-opacity="0.22" stroke-width="1.2" transform="translate(0 1.5)"/>' +
      '</svg>';
    const sheen = face.querySelector('#' + id + 's');

    // Symbole de flux, légèrement en avant
    const flow = IBF.el('div', 'logo-layer logo-flow', root);
    flow.innerHTML =
      '<svg viewBox="' + vb + '" width="' + w + '" height="' + h + '">' +
      '<path class="fl-line" d="' + FLOW_D + '" fill="none" stroke="' + C.accent + '" stroke-width="7" stroke-linecap="round"/>' +
      '<circle cx="' + NODES[0][0] + '" cy="' + NODES[0][1] + '" r="11" fill="' + C.accent + '"/>' +
      '<circle cx="' + NODES[1][0] + '" cy="' + NODES[1][1] + '" r="10" fill="' + C.bg + '" stroke="' + C.accent + '" stroke-width="5"/>' +
      '<circle cx="' + NODES[2][0] + '" cy="' + NODES[2][1] + '" r="11" fill="' + C.accent + '"/>' +
      '<circle class="fl-dot" r="6" fill="' + C.text + '"/>' +
      '</svg>';
    flow.style.transform = 'translateZ(' + (depth * 0.35).toFixed(1) + 'px)';
    const flLine = flow.querySelector('.fl-line');
    const flDot = flow.querySelector('.fl-dot');
    // longueur du tracé (approchée, pour l'animation du trait)
    const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tmp.setAttribute('d', FLOW_D);
    let flLen = 0;
    try {
      flLen = tmp.getTotalLength();
    } catch (e) {
      flLen = 170;
    }
    if (!flLen) flLen = 170;
    flLine.setAttribute('stroke-dasharray', flLen.toFixed(1));
    // points du tracé pré-calculés (pas de mesure pendant le rendu)
    const pts = [];
    for (let i = 0; i <= 60; i++) {
      const u = i / 60;
      // Bézier cubiques du tracé FLOW_D
      let x, y;
      const c = u < 0.5 ? FB[0] : FB[1];
      const s = u < 0.5 ? u / 0.5 : (u - 0.5) / 0.5;
      x = bz(c[0], c[1], c[2], c[3], s);
      y = bz(c[4], c[5], c[6], c[7], s);
      pts.push([x, y]);
    }

    function bz(a, b, c, d, s) {
      const q = 1 - s;
      return q * q * q * a + 3 * q * q * s * b + 3 * q * s * s * c + s * s * s * d;
    }

    return {
      root,
      face,
      flow,
      layers,
      w,
      h,
      // sheenX : position du reflet (-1 → 1 traverse la surface)
      // flowDraw : 0 → 1 (tracé du flux), dotU : position du point lumineux (0 → 1)
      update(sheenX, flowDraw, dotU, dotA) {
        const x = -400 + (sheenX + 1) * 570;
        IBF.A(sheen, 'x1', x.toFixed(1));
        IBF.A(sheen, 'x2', (x + 240).toFixed(1));
        IBF.A(flLine, 'stroke-dashoffset', ((1 - flowDraw) * flLen).toFixed(1));
        const p = pts[Math.max(0, Math.min(60, Math.round(dotU * 60)))];
        IBF.A(flDot, 'cx', p[0].toFixed(1));
        IBF.A(flDot, 'cy', p[1].toFixed(1));
        IBF.A(flDot, 'opacity', String(IBF.fix(dotA, 3)));
      }
    };
  };
})();

</script>
<script>
/* ==========================================================================
   bg.js : arrière-plan (plan le plus éloigné, parallaxe ×0,4)
   - éclairage vert volumétrique venant du haut + poussières dans le faisceau
   - sol en perspective : grille de points verts lumineux avec halo (motif signature)
   - ondes lumineuses (clic, impact du logo)
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  const W = 1920, H = 820; // taille du canvas (cadre 21:9)
  const FIT = IBF.FIT;

  function sprite(size, stops, rgb) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const r = size / 2;
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    for (const s of stops) gr.addColorStop(s[0], 'rgba(' + rgb.join(',') + ',' + s[1] + ')');
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    return c;
  }
  IBF.sprite = sprite;

  IBF.Background = function (canvas) {
    const g = canvas.getContext('2d');
    const A = IBF.RGB.accent;
    const dot = sprite(64, [[0, 1], [0.14, 0.95], [0.3, 0.32], [0.55, 0.08], [1, 0]], A);
    const soft = sprite(256, [[0, 1], [0.35, 0.45], [0.7, 0.1], [1, 0]], A);
    const mote = sprite(32, [[0, 0.9], [0.4, 0.3], [1, 0]], IBF.RGB.text);
    let S = 1;

    // Faisceau pré-rendu (dégradés uniquement, aucun filtre coûteux)
    const beam = document.createElement('canvas');
    function renderBeam() {
      const k = S * FIT.s;
      beam.width = Math.round(FIT.w * k);
      beam.height = Math.round(FIT.h * k);
      const b = beam.getContext('2d');
      b.setTransform(k, 0, 0, k, -FIT.x0 * k, -FIT.y0 * k);
      b.globalCompositeOperation = 'lighter';
      // halo haut
      let gr = b.createRadialGradient(540, -160, 0, 540, -160, 1300);
      gr.addColorStop(0, IBF.rgba('accent', 0.2));
      gr.addColorStop(0.35, IBF.rgba('accent', 0.07));
      gr.addColorStop(1, IBF.rgba('accent', 0));
      b.fillStyle = gr;
      b.fillRect(FIT.x0, FIT.y0, FIT.w, FIT.h);
      // cône principal (ellipse étirée)
      const cone = (x, ang, sx, sy, a) => {
        b.save();
        b.translate(x, -80);
        b.rotate(ang);
        b.scale(sx, sy);
        const c = b.createRadialGradient(0, 0, 0, 0, 0, 1000);
        c.addColorStop(0, IBF.rgba('accent', a));
        c.addColorStop(0.45, IBF.rgba('accent', a * 0.42));
        c.addColorStop(1, IBF.rgba('accent', 0));
        b.fillStyle = c;
        b.beginPath();
        b.arc(0, 0, 1000, 0, Math.PI * 2);
        b.fill();
        b.restore();
      };
      cone(540, 0, 0.36, 1.75, 0.16);
      cone(470, 0.1, 0.07, 1.9, 0.07);
      cone(620, -0.08, 0.06, 1.9, 0.06);
      cone(540, 0.02, 0.04, 2.0, 0.07);
    }

    // Grille du sol (coordonnées monde)
    const pts = [];
    for (let iz = 0; iz < 64; iz++) {
      for (let ix = -29; ix <= 29; ix++) pts.push(ix * 100, 260 + iz * 100);
    }
    // Poussières dans le faisceau
    const rnd = IBF.rng(7);
    const motes = [];
    for (let i = 0; i < 70; i++) {
      motes.push({ x: 540 + (rnd() - 0.5) * 2400, y: rnd() * 1500, s: 1 + rnd() * 2.2, v: 6 + rnd() * 18, ph: rnd() * 10, a: 0.15 + rnd() * 0.35 });
    }

    function resize(s) {
      S = s;
      canvas.width = Math.round(W * s);
      canvas.height = Math.round(H * s);
      renderBeam();
    }
    resize(1);

    function draw(fr) {
      const F = fr.floor;
      g.setTransform(S * FIT.s, 0, 0, S * FIT.s, S * FIT.tx, S * FIT.ty);
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
      g.fillStyle = IBF.C.bg;
      g.fillRect(FIT.x0, FIT.y0, FIT.w, FIT.h);
      // légère remontée au centre (noir charbon)
      let gr = g.createRadialGradient(540, 900, 0, 540, 900, 1500);
      gr.addColorStop(0, IBF.rgba('card', 0.95));
      gr.addColorStop(1, IBF.rgba('card', 0));
      g.fillStyle = gr;
      g.fillRect(FIT.x0, FIT.y0, FIT.w, FIT.h);

      g.globalCompositeOperation = 'lighter';
      // faisceau
      if (fr.light > 0.001) {
        g.globalAlpha = Math.min(1, fr.light);
        const sway = Math.sin(fr.t * 0.35) * 14 + fr.camX * 0.4;
        g.drawImage(beam, FIT.x0 + sway - 8, FIT.y0, FIT.w + 16, FIT.h);
        // poussières
        g.globalAlpha = 1;
        for (const m of motes) {
          const y = (m.y + fr.t * m.v) % 1500;
          const x = m.x + Math.sin(fr.t * 0.5 + m.ph) * 20 + (y / 1500) * (m.x - 540) * 0.5 + fr.camX * 0.4;
          const a = m.a * fr.light * (1 - y / 1500) * 0.8;
          if (a < 0.01) continue;
          g.globalAlpha = a;
          g.drawImage(mote, x - m.s * 3, y - m.s * 3, m.s * 6, m.s * 6);
        }
      }

      // bande de lumière à l'horizon
      const hz = F.horizon;
      g.globalAlpha = F.alpha;
      gr = g.createLinearGradient(0, hz - 140, 0, hz + 220);
      gr.addColorStop(0, IBF.rgba('accent', 0));
      gr.addColorStop(0.4, IBF.rgba('accent', 0.05));
      gr.addColorStop(1, IBF.rgba('accent', 0));
      g.fillStyle = gr;
      g.fillRect(FIT.x0, hz - 140, FIT.w, 360);

      // halo au sol sous l'élément actif
      const hl = F.halo;
      if (hl.a > 0.001) {
        g.globalAlpha = Math.min(1, hl.a * 0.55 * F.alpha);
        g.drawImage(soft, hl.x - hl.r * 1.2, hl.y - hl.r * 0.42, hl.r * 2.4, hl.r * 0.84);
      }

      // grille de points
      const cy = Math.cos(F.yaw), sy = Math.sin(F.yaw);
      const Fo = 1000, camH = F.height;
      const rv = F.reveal, rcx = 540, rcy = hz + 330;
      const waves = F.waves;
      const hx = hl.x, hy = hl.y, hr = hl.r, ha = hl.a;
      for (let i = 0; i < pts.length; i += 2) {
        const X = pts[i] - F.x, Z = pts[i + 1] - F.dolly;
        const xr = X * cy - Z * sy;
        const zr = X * sy + Z * cy;
        if (zr < 90) continue;
        const sx = 540 + (Fo * xr) / zr;
        if (sx < FIT.x0 - 30 || sx > FIT.x1 + 30) continue;
        const syy = hz + (Fo * camH) / zr;
        if (syy > FIT.y1 + 30 || syy < hz) continue;
        // brouillard avec la distance
        let fog = 1 - IBF.smooth(1400, 6400, zr);
        if (fog <= 0.01) continue;
        // révélation depuis le centre
        let m = 1;
        if (rv < 5000) {
          const dxr = sx - rcx, dyr = (syy - rcy) * 2.2;
          m = IBF.clamp((rv - Math.sqrt(dxr * dxr + dyr * dyr)) / 240);
          if (m <= 0) continue;
        }
        // halo
        const dx = (sx - hx) / hr, dy = (syy - hy) / (hr * 0.42);
        let boost = ha * Math.exp(-(dx * dx + dy * dy) * 1.5);
        // ondes
        for (let w = 0; w < waves.length; w++) {
          const wv = waves[w];
          const ex = sx - wv.x, ey = (syy - wv.y) * 2.6;
          const d = Math.sqrt(ex * ex + ey * ey);
          const e = (d - wv.r) / wv.w;
          boost += wv.a * Math.exp(-e * e);
        }
        const r = Math.min(7.5, Math.max(0.9, (Fo * 5.2) / zr)) * (1 + boost * 0.5);
        const a = F.alpha * m * fog * (0.17 + 0.62 * boost);
        if (a < 0.008) continue;
        g.globalAlpha = Math.min(1, a);
        const s = r * 4.2;
        g.drawImage(dot, sx - s / 2, syy - s / 2, s, s);
      }
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    }

    return { draw, resize };
  };
})();

</script>
<script>
/* ==========================================================================
   fx.js : premier plan (parallaxe ×1,6)
   - particules vertes du logo (sortent du bouton, tourbillonnent, forment « IB »)
   - ondes de choc, traînées lumineuses de la transition, évaporation des chiffres
   - bokeh flou au premier plan, dissolution finale du logo
   Tout est fonction du temps t (aléatoire à graine fixe) → rendu reproductible.
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  const W = 1920, H = 820; // taille du canvas (cadre 21:9)
  const FIT = IBF.FIT;

  // Placement des logos (unités du monogramme → écran)
  IBF.LOGO_S2 = { cx: 540, cy: 800, size: 380, ux: 266, uy: 180 };
  IBF.LOGO_S10 = { cx: 540, cy: 360, size: 140, ux: 266, uy: 180 };
  IBF.S1_BUTTON = { x: 916, y: 1030 };
  IBF.T_IMPACT = IBF.bar(2); // 5,870 s : début de mesure
  IBF.T_DISSOLVE = 39.0;

  IBF.FX = function (canvas) {
    const g = canvas.getContext('2d');
    const A = IBF.RGB.accent, T = IBF.RGB.text;
    const pdot = IBF.sprite(32, [[0, 1], [0.22, 0.85], [0.5, 0.22], [1, 0]], A);
    const pwhite = IBF.sprite(32, [[0, 1], [0.3, 0.55], [1, 0]], T);
    const bok = IBF.sprite(128, [[0, 0.85], [0.55, 0.5], [0.82, 0.14], [1, 0]], A);
    let S = 1;
    let quality = 1;

    function resize(s) {
      S = s;
      canvas.width = Math.round(W * s);
      canvas.height = Math.round(H * s);
    }
    resize(1);

    /* ---------- Échantillonnage du monogramme ---------- */
    function sampleLogo(n, seed) {
      const cw = IBF.LOGO.vw, ch = IBF.LOGO.vh;
      const c = document.createElement('canvas');
      c.width = cw;
      c.height = ch;
      const x = c.getContext('2d');
      x.translate(10, 10);
      x.fillStyle = '#1FE07A';
      x.fill(IBF.logoPath2D(), 'evenodd');
      x.strokeStyle = '#1FE07A';
      x.lineWidth = 7;
      x.lineCap = 'round';
      x.stroke(new Path2D(IBF.LOGO.flow));
      for (const nd of IBF.LOGO.nodes) {
        x.beginPath();
        x.arc(nd[0], nd[1], 11, 0, Math.PI * 2);
        x.fill();
      }
      const d = x.getImageData(0, 0, cw, ch).data;
      const inside = (px, py) => px >= 0 && py >= 0 && px < cw && py < ch && d[(py * cw + px) * 4 + 3] > 128;
      const rnd = IBF.rng(seed);
      const out = [];
      let guard = 0;
      while (out.length < n && guard++ < n * 200) {
        const px = Math.floor(rnd() * cw), py = Math.floor(rnd() * ch);
        if (!inside(px, py)) continue;
        const edge = !inside(px + 3, py) || !inside(px - 3, py) || !inside(px, py + 3) || !inside(px, py - 3);
        if (!edge && rnd() > 0.45) continue;
        out.push([px - 10, py - 10, edge ? 1 : 0]);
      }
      return out;
    }

    /* ---------- Particules du logo (scènes 1 → 2) ---------- */
    let LP = null;
    const VC = { x: 540, y: 800 }; // centre du tourbillon (= centre du logo)
    function buildLogoParticles(n) {
      const smp = sampleLogo(n, 11);
      const rnd = IBF.rng(12);
      const M = IBF.LOGO_S2, k = M.size / 360;
      const src = IBF.S1_BUTTON;
      LP = smp.map((s) => {
        const sx = src.x + (rnd() - 0.5) * 70, sy = src.y + (rnd() - 0.5) * 40;
        const dx = sx - VC.x, dy = (sy - VC.y) / 0.78;
        return {
          tx: M.cx + (s[0] - M.ux) * k,
          ty: M.cy + (s[1] - M.uy) * k,
          R0: Math.hypot(dx, dy),
          Rr: 240 + rnd() * 260,
          th0: Math.atan2(dy, dx),
          phase: rnd() * Math.PI * 2,
          w: 2.6 + rnd() * 2.2,
          t0: 3.5 + rnd() * 0.3,
          size: 1.2 + rnd() * 1.5 + s[2] * 0.5,
          a: 0.5 + rnd() * 0.5,
          sp: rnd() < 0.18,
          spd: 140 + rnd() * 360,
          sdir: rnd() * Math.PI * 2,
          ph: rnd() * 6.283
        };
      });
    }
    function lpPos(p, t) {
      const TI = IBF.T_IMPACT;
      const tau = IBF.clamp((t - p.t0) / (TI - p.t0));
      // sortie du bouton → anneau tourbillonnant autour du logo → convergence
      const spread = IBF.smooth(0, 0.4, tau);
      const th = p.th0 + p.w * tau + p.phase * spread + Math.sin(tau * 4 + p.ph) * 0.08;
      const R = IBF.lerp(p.R0, p.Rr, IBF.smooth(0, 0.35, tau)) * (1 - 0.3 * tau);
      const vx = VC.x + Math.cos(th) * R;
      const vy = VC.y + Math.sin(th) * R * 0.78;
      const wgt = IBF.easeInCubic(IBF.smooth(0.22, 1, tau));
      return [vx + (p.tx - vx) * wgt, vy + (p.ty - vy) * wgt];
    }
    function drawLogoParticles(t) {
      const TI = IBF.T_IMPACT;
      if (!LP || t < 3.45 || t > TI + 1.0) return;
      const step = quality < 1 ? 2 : 1;
      g.globalCompositeOperation = 'lighter';
      // traînées (un seul tracé)
      if (t < TI) {
        g.globalAlpha = 0.32;
        g.strokeStyle = IBF.rgba('accent', 1);
        g.lineWidth = 1.6;
        g.lineCap = 'round';
        g.beginPath();
        for (let i = 0; i < LP.length; i += step) {
          const p = LP[i];
          if (t < p.t0 + 0.02) continue;
          const a = lpPos(p, t), b = lpPos(p, Math.max(p.t0, t - 0.06));
          g.moveTo(b[0], b[1]);
          g.lineTo(a[0], a[1]);
        }
        g.stroke();
      }
      const pre = IBF.smooth(TI - 0.6, TI, t);
      for (let i = 0; i < LP.length; i += step) {
        const p = LP[i];
        if (t < p.t0) continue;
        let x, y, a = p.a, s = p.size;
        if (t <= TI) {
          const q = lpPos(p, t);
          x = q[0];
          y = q[1];
          a = Math.min(1, a * IBF.smooth(p.t0, p.t0 + 0.12, t) + pre * 0.35);
          s *= 1 + pre * 0.3;
        } else {
          const u = t - TI;
          if (p.sp) {
            const dd = p.spd * IBF.easeOutCubic(u / 0.95);
            x = p.tx + Math.cos(p.sdir) * dd;
            y = p.ty + Math.sin(p.sdir) * dd;
            a *= Math.max(0, 1 - u / 0.95);
          } else {
            x = p.tx;
            y = p.ty;
            a *= Math.max(0, 1 - u / 0.2);
          }
          if (a <= 0.01) continue;
        }
        g.globalAlpha = a;
        g.drawImage(pdot, x - s * 2.3, y - s * 2.3, s * 4.6, s * 4.6);
      }
    }

    /* ---------- Dissolution du logo final (scène 10) ---------- */
    let DP = null;
    function buildDissolve(n) {
      const smp = sampleLogo(n, 31);
      const rnd = IBF.rng(32);
      const M = IBF.LOGO_S10, k = M.size / 360;
      DP = smp.map((s) => ({
        x: M.cx + (s[0] - M.ux) * k,
        y: M.cy + (s[1] - M.uy) * k,
        ts: IBF.T_DISSOLVE + (1 - s[1] / 360) * 0.3 + rnd() * 0.14,
        rise: 70 + rnd() * 230,
        drift: (rnd() - 0.5) * 110,
        life: 0.55 + rnd() * 0.45,
        s: 0.8 + rnd() * 1.2,
        a: 0.55 + rnd() * 0.45,
        ph: rnd() * 6.283
      }));
    }
    function drawDissolve(t) {
      const TD = IBF.T_DISSOLVE;
      if (!DP || t < TD - 0.1) return;
      g.globalCompositeOperation = 'lighter';
      for (const p of DP) {
        const age = t - p.ts;
        let x = p.x, y = p.y, a = p.a;
        if (age < 0) {
          a *= IBF.smooth(TD - 0.1, TD + 0.12, t) * 0.7;
        } else {
          const u = age / p.life;
          if (u > 1) continue;
          y -= p.rise * IBF.easeOutCubic(u);
          x += p.drift * u + Math.sin(p.ph + age * 7) * 5;
          a *= 1 - u;
        }
        if (a < 0.01) continue;
        g.globalAlpha = a;
        const s = p.s * 4.4;
        g.drawImage(pdot, x - s / 2, y - s / 2, s, s);
      }
    }

    /* ---------- Évaporation des chiffres (scène 4) ---------- */
    const EV = [];
    (function () {
      const rnd = IBF.rng(21);
      for (let i = 0; i < 330; i++) {
        EV.push({
          b: 12.9 + rnd() * 3.7,
          card: i % 3,
          ox: rnd(),
          life: 1.2 + rnd() * 1.2,
          rise: 70 + rnd() * 170,
          drift: (rnd() - 0.5) * 60,
          s: 0.8 + rnd() * 1.5,
          a: 0.25 + rnd() * 0.5,
          white: rnd() < 0.4,
          ph: rnd() * 6.283
        });
      }
    })();
    function drawEvap(fr) {
      const E = fr.evap;
      if (!E) return;
      g.globalCompositeOperation = 'lighter';
      for (const p of EV) {
        const e = E[p.card];
        if (!e || e.a <= 0.01) continue;
        const age = fr.t - p.b;
        if (age < 0 || age > p.life || fr.t < e.from) continue;
        const u = age / p.life;
        const x = e.x0 + (e.x1 - e.x0) * p.ox + p.drift * u + Math.sin(p.ph + age * 4) * 5;
        const y = e.y - p.rise * IBF.easeOutCubic(u);
        const a = p.a * e.a * Math.sin(Math.PI * u);
        if (a < 0.01) continue;
        g.globalAlpha = a;
        const s = p.s * 4;
        g.drawImage(p.white ? pwhite : pdot, x - s / 2, y - s / 2, s, s);
      }
    }

    /* ---------- Ondes de choc ---------- */
    function drawRings(fr) {
      g.globalCompositeOperation = 'lighter';
      for (const r of fr.rings) {
        const u = (fr.t - r.t0) / r.dur;
        if (u < 0 || u > 1) continue;
        const R = r.r0 + (r.maxR - r.r0) * IBF.easeOutCubic(u);
        const a = r.a * Math.pow(1 - u, 1.4);
        g.strokeStyle = IBF.rgba('accent', 1);
        g.globalAlpha = a * 0.22;
        g.lineWidth = r.w * 5 * (1 - u * 0.5);
        g.beginPath();
        g.ellipse(r.x, r.y, R, R * (r.squash || 1), 0, 0, Math.PI * 2);
        g.stroke();
        g.globalAlpha = a;
        g.lineWidth = Math.max(1, r.w * (1 - u * 0.7));
        g.stroke();
      }
    }

    /* ---------- Traînées de la transition (scène 8) ---------- */
    const ST = [];
    (function () {
      const rnd = IBF.rng(41);
      for (let i = 0; i < 56; i++) {
        const c = rnd();
        ST.push({
          y: 960 + (rnd() - 0.5) * 1500 * (0.35 + c * 0.65),
          len: 220 + rnd() * 1000,
          th: 1.2 + rnd() * 4.8,
          sp: 2600 + rnd() * 3800,
          x0: rnd() * 3800,
          a: 0.12 + rnd() * 0.55
        });
      }
    })();
    function drawStreaks(fr) {
      const k = fr.streaks;
      if (!k || k < 0.01) return;
      g.globalCompositeOperation = 'lighter';
      for (const s of ST) {
        const x = ((((s.x0 - (fr.t - 31.9) * s.sp) % 3800) + 3800) % 3800) - 1200;
        const gr = g.createLinearGradient(x, 0, x + s.len, 0);
        gr.addColorStop(0, IBF.rgba('accent', 0));
        gr.addColorStop(0.25, IBF.rgba('accent', 1));
        gr.addColorStop(0.3, IBF.rgba('text', 0.9));
        gr.addColorStop(1, IBF.rgba('accent', 0));
        g.globalAlpha = s.a * k;
        g.fillStyle = gr;
        g.fillRect(x, s.y - s.th / 2, s.len, s.th);
      }
    }

    /* ---------- Bokeh (premier plan flou) ---------- */
    const BK = [];
    (function () {
      const rnd = IBF.rng(51);
      for (let i = 0; i < 15; i++) {
        BK.push({ x: FIT.x0 + rnd() * FIT.w, y: FIT.y0 + rnd() * FIT.h, r: 26 + rnd() * 84, a: 0.03 + rnd() * 0.07, sx: rnd() * 50, sy: rnd() * 50, sp: 0.05 + rnd() * 0.1 });
      }
    })();
    function drawBokeh(fr) {
      if (!fr.bokeh) return;
      g.globalCompositeOperation = 'lighter';
      for (const b of BK) {
        const x = b.x + IBF.noise1(fr.t * b.sp, b.sx) * 90 + fr.camX * 1.6;
        const y = b.y + IBF.noise1(fr.t * b.sp, b.sy) * 130 + fr.camY * 1.6;
        g.globalAlpha = b.a * fr.bokeh;
        g.drawImage(bok, x - b.r, y - b.r, b.r * 2, b.r * 2);
      }
    }

    function draw(fr) {
      g.setTransform(S * FIT.s, 0, 0, S * FIT.s, S * FIT.tx, S * FIT.ty);
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
      g.clearRect(FIT.x0, FIT.y0, FIT.w, FIT.h);
      drawBokeh(fr);
      drawRings(fr);
      drawLogoParticles(fr.t);
      drawEvap(fr);
      drawStreaks(fr);
      drawDissolve(fr.t);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    }

    return {
      draw,
      resize,
      build() {
        buildLogoParticles(1500);
        buildDissolve(900);
      },
      setQuality(q) {
        quality = q;
      }
    };
  };
})();

</script>
<script>
/* ==========================================================================
   direction.js : « direction photo » de l'arrière-plan, image par image.
   Intensité du faisceau, halo au sol, ondes, flash, traînées, dérive caméra.
   Les valeurs clés sont posées sur la grille musicale (voir core.js).
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  const B = IBF.BEAT;
  const TI = IBF.T_IMPACT; // impact du logo (5,870 s)
  const T_PRESS1 = IBF.beat(3); // clic de la recherche (1,957 s)
  const T_PRESS2 = IBF.beat(58); // clic du bouton final (37,826 s)
  IBF.T_PRESS1 = T_PRESS1;
  IBF.T_PRESS2 = T_PRESS2;

  // pistes de valeurs clés [temps, valeur] interpolées en douceur
  const K = {
    light: [
      [0, 0], [1.3, 1], [5.55, 0.9], [TI, 1.7], [6.5, 1.05], [7.17, 1], [8.4, 1], [8.6, 1.2], [11.3, 1.12],
      [11.95, 0.6], [16.7, 0.6], [17.1, 0.95], [21.9, 0.95], [22.4, 1.02], [26.5, 1.02], [26.9, 1.25],
      [31.8, 1.2], [32.3, 0.72], [33.6, 0.78], [34.1, 0.88], [36.9, 0.88], [37.4, 1.1], [40, 1.1]
    ],
    floorA: [
      [0, 1], [11.5, 1], [11.95, 0.72], [16.7, 0.72], [17.1, 0.95], [31.9, 1], [32.15, 0.3], [33.4, 0.4],
      [34.1, 0.9], [40, 1]
    ],
    haloA: [
      [0, 0], [1.2, 0.55], [5.5, 0.6], [TI, 1.3], [6.8, 0.75], [7.2, 0.55], [11.5, 0.55], [11.95, 0.28],
      [16.7, 0.28], [17.1, 0.5], [22.0, 0.5], [22.4, 0.62], [26.5, 0.62], [26.9, 0.8], [31.8, 0.8],
      [32.2, 0.2], [33.6, 0.3], [34.1, 0.5], [37.0, 0.5], [37.4, 0.85], [40, 0.85]
    ],
    haloY: [[0, 1420], [3.9, 1400], [4.2, 1330], [7.0, 1330], [7.4, 1470], [40, 1470]],
    horizon: [[0, 1180], [3.9, 1180], [4.3, 1150], [7.0, 1150], [7.4, 1190], [22.0, 1190], [22.5, 1230], [26.5, 1230], [26.9, 1180], [40, 1180]]
  };
  function kf(track, t) {
    if (t <= track[0][0]) return track[0][1];
    for (let i = 1; i < track.length; i++) {
      const a = track[i - 1], b = track[i];
      if (t <= b[0]) {
        const p = IBF.easeInOutCubic((t - a[0]) / (b[0] - a[0]));
        return a[1] + (b[1] - a[1]) * p;
      }
    }
    return track[track.length - 1][1];
  }
  IBF.kf = kf;

  // impulsion sur chaque temps (kick) entre deux instants
  function beatPulse(t, from, to, decay) {
    if (t < from || t > to) return 0;
    const k = (t - from) / B;
    const ph = (k - Math.floor(k)) * B;
    return Math.exp(-ph * (decay || 7));
  }
  IBF.beatPulse = beatPulse;

  IBF.direction = function (t, fr) {
    const F = fr.floor;
    // travelling avant continu + dérive lente (parallaxe du fond ×0,4)
    F.dolly = (t * 55) % 100;
    fr.camX = Math.sin(t * 0.27) * 22;
    fr.camY = Math.cos(t * 0.19) * 14;
    F.yaw = Math.sin(t * 0.21) * 0.035;
    F.x = fr.camX * 0.4;
    F.horizon = kf(K.horizon, t);

    fr.light = kf(K.light, t);
    F.alpha = kf(K.floorA, t);
    F.halo.a = kf(K.haloA, t);
    F.halo.y = kf(K.haloY, t);
    F.halo.x = 540 + fr.camX * 0.4;
    F.halo.r = 560;

    // Scène 1 : la grille s'allume depuis le centre
    if (t < 2.2) {
      F.reveal = IBF.lerp(0, 2800, IBF.easeInOut(IBF.seg(t, 0.05, 1.6)));
      fr.bokeh = IBF.smooth(0.3, 1.6, t);
    }
    // onde au clic de la recherche
    addWave(F, t, T_PRESS1, 720, 1330, 1.1, 0.75, 900);
    // impact du logo : onde de choc + flash
    addWave(F, t, TI, 540, 1300, 1.4, 1.5, 1500);
    if (t >= TI && t < TI + 0.5) fr.flash = 0.8 * Math.pow(1 - (t - TI) / 0.5, 2.2);
    if (t >= TI - 0.05 && t < TI + 1.2) {
      fr.rings.push({ t0: TI, dur: 1.0, x: 540, y: 800, r0: 60, maxR: 980, w: 5, a: 0.9, squash: 1 });
      fr.rings.push({ t0: TI + 0.08, dur: 1.1, x: 540, y: 800, r0: 40, maxR: 640, w: 3, a: 0.5, squash: 1 });
    }
    if (t >= T_PRESS1 && t < T_PRESS1 + 1) {
      fr.rings.push({ t0: T_PRESS1, dur: 0.7, x: IBF.S1_BUTTON.x, y: IBF.S1_BUTTON.y - 8, r0: 56, maxR: 230, w: 4, a: 0.8, squash: 1 });
    }
    // groove (8,48 s) : légère respiration du halo sur les temps
    const groove = beatPulse(t, IBF.beat(11), IBF.beat(49), 6);
    F.halo.a += groove * (t > 26.7 ? 0.28 : 0.12);
    // Pic (témoignage) : halo plus large
    if (t > 26.7 && t < 32) F.halo.r = 640;
    // Transition : le fond pivote avec le coup de caméra, traînées lumineuses
    if (t >= 31.9 && t < 33.9) {
      const w = IBF.easeInOut(IBF.seg(t, 31.957, 1.4));
      F.yaw += Math.sin(w * Math.PI) * 0.22;
      fr.camX -= Math.sin(w * Math.PI) * 60;
      fr.streaks = IBF.smooth(31.95, 32.15, t) * (1 - IBF.smooth(33.0, 33.75, t));
      fr.mblur = 0;
    }
    // clic final : onde + petit flash
    addWave(F, t, T_PRESS2, 540, 1330, 1.2, 1.0, 1100);
    if (t >= T_PRESS2 && t < T_PRESS2 + 0.35) fr.flash = 0.22 * Math.pow(1 - (t - T_PRESS2) / 0.35, 2);
    if (t >= T_PRESS2 && t < T_PRESS2 + 1) {
      fr.rings.push({ t0: T_PRESS2, dur: 0.8, x: 540, y: 905, r0: 100, maxR: 560, w: 4, a: 0.7, squash: 0.32 });
    }
  };

  function addWave(F, t, t0, x, y, dur, a, speed) {
    const u = (t - t0) / dur;
    if (u < 0 || u > 1) return;
    F.waves.push({ x, y, r: (t - t0) * speed, w: 60 + u * 60, a: a * Math.pow(1 - u, 1.3) });
  }
})();

</script>
<script>
/* ==========================================================================
   stage.js : moteur de rendu. Construit la scène 1080 × 1920 et calcule
   chaque image à partir du temps t :
     arrière-plan (canvas) → monde 3D (DOM + CSS 3D) → premier plan (canvas)
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  IBF.sceneDefs = [];

  // Déclare une scène : { index, pre, post, build(el, api), render(t, fr, el) }
  IBF.defineScene = function (def) {
    const info = IBF.SCENES[def.index];
    def.id = info.id;
    def.start = info.start;
    def.end = info.end;
    def.pre = def.pre || 0;
    def.post = def.post || 0;
    IBF.sceneDefs.push(def);
  };

  // Couches d'extrusion génériques (non utilisées par défaut, gardées pour le logo)
  IBF.frameDefaults = function (t) {
    return {
      t,
      light: 1,
      camX: 0,
      camY: 0,
      floor: {
        horizon: 1180,
        height: 520,
        yaw: 0,
        x: 0,
        dolly: 0,
        alpha: 1,
        reveal: 1e9,
        halo: { x: 540, y: 1480, r: 520, a: 0.5 },
        waves: []
      },
      rings: [],
      evap: null,
      streaks: 0,
      bokeh: 1,
      flash: 0,
      mblur: 0
    };
  };

  IBF.Stage = function (root, opts) {
    opts = opts || {};
    root.classList.add('stage');
    root.innerHTML = '';
    const bgC = IBF.el('canvas', 'layer bg', root);
    const world = IBF.el('div', 'world', root);
    const fxC = IBF.el('canvas', 'layer fx', root);
    const flash = IBF.el('div', 'flash', root);
    flash.style.background =
      'radial-gradient(circle at 50% 42%, ' + IBF.rgba('text', 0.55) + ', ' + IBF.rgba('accent', 0.35) + ' 22%, ' + IBF.rgba('accent', 0) + ' 60%)';
    IBF.el('div', 'vignette', root);
    const grain = IBF.el('div', 'grain', root);
    grain.style.backgroundImage = 'url(' + noiseTile() + ')';
    const grainMode = opts.grain || 'anim'; // 'anim' | 'static' | 'off'
    if (grainMode === 'off') grain.style.display = 'none';
    if (opts.grainOpacity != null) grain.style.opacity = String(opts.grainOpacity);

    // Filtre SVG : flou de mouvement directionnel (horizontal)
    const defs = IBF.html(
      '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
        '<filter id="ibf-mblur" x="-40%" y="-4%" width="180%" height="108%" color-interpolation-filters="sRGB">' +
        '<feGaussianBlur id="ibf-mblur-std" stdDeviation="0 0"/></filter></defs></svg>'
    );
    root.appendChild(defs);
    const mblurStd = defs.querySelector('#ibf-mblur-std');

    const bg = IBF.Background(bgC);
    const fx = IBF.FX(fxC);
    fx.build();

    const api = { root, world, mblurStd };
    const scenes = IBF.sceneDefs
      .slice()
      .sort((a, b) => a.index - b.index)
      .map((def) => {
        const el = IBF.el('div', 'scene', world);
        el.dataset.scene = def.id;
        def.build(el, api);
        return { def, el, on: false };
      });

    let quality = 1;
    let res = 1;

    function setResolution(s) {
      s = Math.max(0.35, Math.min(1, s));
      if (Math.abs(s - res) < 0.02) return;
      res = s;
      bg.resize(s);
      fx.resize(s);
    }
    function setQuality(q) {
      quality = q;
      root.dataset.quality = q < 1 ? 'low' : 'high';
      fx.setQuality(q);
    }

    let lastT = -1;
    function render(t) {
      t = Math.max(0, Math.min(IBF.DURATION, t));
      lastT = t;
      const fr = IBF.frameDefaults(t);
      IBF.direction(t, fr); // éclairage, caméra de fond, halo : voir direction.js
      for (const s of scenes) {
        const d = s.def;
        const on = t >= d.start - d.pre && t < d.end + d.post;
        if (on !== s.on) {
          s.on = on;
          s.el.style.display = on ? 'block' : 'none';
        }
        if (on) d.render(t, fr, s.el, api);
      }
      bg.draw(fr);
      fx.draw(fr);
      IBF.S(flash, 'opacity', String(IBF.fix(IBF.clamp(fr.flash), 3)));
      IBF.A(mblurStd, 'stdDeviation', IBF.fix(fr.mblur, 1) + ' 0');
      // grain : animé à l'écran ; fixe (ou absent) à l'export pour garder un MP4 léger
      if (grainMode === 'anim') {
        const f = Math.round(t * IBF.FPS);
        IBF.S(grain, 'backgroundPosition', ((f * 73) % 256) + 'px ' + ((f * 151) % 256) + 'px');
      }
      return fr;
    }

    return { render, setResolution, setQuality, get t() { return lastT; } };
  };

  // Tuile de bruit (couleur texte #F2F5F3, transparence aléatoire) pour casser les aplats
  function noiseTile() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    const img = g.createImageData(256, 256);
    const rnd = IBF.rng(99);
    for (let i = 0; i < img.data.length; i += 4) {
      img.data[i] = 242;
      img.data[i + 1] = 245;
      img.data[i + 2] = 243;
      img.data[i + 3] = Math.floor(rnd() * 255);
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL('image/png');
  }
})();

<script>
/* ==========================================================================
   kit.js : briques communes aux scènes (lignes de titre, mots, cartes, caméra).
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  const K = (IBF.kit = {});

  // Conteneur « caméra » plein cadre (reçoit travelling et rotations)
  K.cam = function (parent) {
    const c = IBF.el('div', 'p3 abs', parent);
    c.style.cssText = 'left:0;top:0;width:1080px;height:1920px;transform-origin:540px 883px;';
    c._s = {};
    return c;
  };
  K.camT = function (c, o) {
    const s =
      'translate3d(' + IBF.fix(o.x || 0) + 'px,' + IBF.fix(o.y || 0) + 'px,' + IBF.fix(o.z || 0) + 'px) ' +
      'rotateX(' + IBF.fix(o.rx || 0, 3) + 'deg) rotateY(' + IBF.fix(o.ry || 0, 3) + 'deg) rotateZ(' + IBF.fix(o.rz || 0, 3) + 'deg)';
    IBF.S(c, 'transform', s);
  };

  // Ligne de texte centrée ; groups = [[texte, classe], ...] → renvoie les spans
  K.line = function (parent, top, size, groups, cls) {
    const l = IBF.el('div', 'line ' + (cls || 't-title'), parent);
    l.style.top = top + 'px';
    l.style.fontSize = size + 'px';
    const spans = [];
    groups.forEach((g, i) => {
      if (i > 0) l.appendChild(document.createTextNode(' '));
      const sp = IBF.el('span', 'word ' + (g[1] || ''), l, g[0]);
      spans.push(sp);
    });
    l._spans = spans;
    return l;
  };

  // Carte 3D (face + épaisseur + reflet)
  K.card = function (parent, x, y, w, h, cls) {
    const c = IBF.el('div', 'card3d ' + (cls || ''), parent);
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.style.transformOrigin = '50% 50%';
    return c;
  };

  // Pastille d'icône en relief
  K.icobox = function (parent, x, y, size, icon, isz) {
    const b = IBF.el('div', 'icobox', parent);
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.borderRadius = Math.round(size * 0.28) + 'px';
    b.innerHTML = IBF.icon(icon, { size: isz || Math.round(size * 0.56), stroke: 2.6 });
    return b;
  };

  K.abs = function (parent, cls, x, y, w, h, text) {
    const e = IBF.el('div', cls, parent, text);
    e.style.position = 'absolute';
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    if (w != null) e.style.width = w + 'px';
    if (h != null) e.style.height = h + 'px';
    return e;
  };

  // enveloppe attaque / relâche (0 → 1 → 0)
  K.env = function (t, t0, a, r) {
    if (t < t0) return 0;
    if (t < t0 + a) return IBF.easeOutCubic((t - t0) / a);
    return Math.max(0, 1 - IBF.easeInOutCubic((t - t0 - a) / r));
  };

  // sortie : opacité et flou appliqués à un élément « feuille »
  K.fade = function (e, o, blur) {
    IBF.S(e, 'opacity', String(IBF.fix(IBF.clamp(o), 3)));
    IBF.S(e, 'filter', blur > 0.05 ? 'blur(' + IBF.fix(blur, 2) + 'px)' : 'none');
  };

  // Pose complète d'un élément : translation, rotations, échelle, opacité, flou
  K.pose = function (e, p) {
    let tr = 'translate3d(' + IBF.fix(p.x || 0) + 'px,' + IBF.fix(p.y || 0) + 'px,' + IBF.fix(p.z || 0) + 'px)';
    if (p.rx) tr += ' rotateX(' + IBF.fix(p.rx, 3) + 'deg)';
    if (p.ry) tr += ' rotateY(' + IBF.fix(p.ry, 3) + 'deg)';
    if (p.rz) tr += ' rotateZ(' + IBF.fix(p.rz, 3) + 'deg)';
    if (p.s != null && Math.abs(p.s - 1) > 1e-4) tr += ' scale(' + IBF.fix(p.s, 4) + ')';
    IBF.S(e, 'transform', tr);
    if (p.o != null) IBF.S(e, 'opacity', String(IBF.fix(IBF.clamp(p.o), 3)));
    if (p.blur != null) IBF.S(e, 'filter', p.blur > 0.05 ? 'blur(' + IBF.fix(p.blur, 2) + 'px)' : 'none');
  };

  // Entrée « monte depuis la profondeur » (p : 0 → 1), k : facteur de sortie (1 → 0)
  K.rise = function (e, p, o, k, extra) {
    o = o || {};
    const q = 1 - p;
    k = k == null ? 1 : k;
    const ex = extra || {};
    K.pose(e, {
      x: ex.x || 0,
      y: q * (o.dy != null ? o.dy : 60) + (ex.y || 0),
      z: q * (o.dz != null ? o.dz : -220) + (ex.z || 0),
      rx: q * (o.rx != null ? o.rx : 70) + (ex.rx || 0),
      ry: ex.ry || 0,
      s: ex.s,
      o: Math.min(1, p * 1.6) * k,
      blur: q * (o.blur != null ? o.blur : 8) + (ex.blur || 0)
    });
  };
})();

</script>
<script>
/* 1 · Accroche — 0 → 3,9 s
   Barre de recherche en relief qui se remplit, clic, « Votre temps est précieux. » */
(function () {
  'use strict';
  const IBF = window.IBF, K = IBF.kit, T = IBF.TXT;

  // instants de frappe (rythme humain légèrement irrégulier, déterministe)
  const TYPE = [];
  (function () {
    const rnd = IBF.rng(3);
    let t = 0.5;
    for (let i = 0; i < T.search.length; i++) {
      TYPE.push(t);
      const ch = T.search[i];
      t += 0.047 + rnd() * 0.022 + (ch === ' ' ? 0.03 : 0);
    }
  })();
  IBF.TYPE_TIMES = TYPE; // utilisé par l'audio (frappes clavier)

  IBF.defineScene({
    index: 0,
    post: 0,
    build(el) {
      const cam = (this.cam = K.cam(el));
      // Titre (au-dessus de la barre)
      this.l1 = K.line(cam, 540, 126, [['Votre'], ['temps']]);
      this.l2 = K.line(cam, 676, 126, [['est'], ['précieux.', 't-accent']]);
      this.words = this.l1._spans.concat(this.l2._spans);

      // Barre de recherche 3D
      const bar = (this.bar = IBF.el('div', 'search', cam));
      bar.style.cssText += 'left:90px;top:956px;width:900px;height:148px;transform-origin:50% 50%;';
      const lens = IBF.el('div', 'lens', bar);
      lens.innerHTML = IBF.icon('search', { size: 52, stroke: 3, color: 'var(--text)' });
      const q = IBF.el('div', 'q', bar);
      this.qtext = IBF.el('span', '', q);
      this.caret = IBF.el('span', 'caret', q);
      const btn = (this.btn = IBF.el('div', 'sbtn', bar));
      btn.style.cssText += 'left:770px;top:18px;width:112px;height:112px;';
      btn.innerHTML = IBF.icon('search', { size: 50, stroke: 3.4, color: 'var(--bg)' });
    },
    render(t, fr) {
      const TP = IBF.T_PRESS1;
      // Caméra : travelling avant lent, rotation −3° → 0°
      const u = IBF.seg(t, 0, 3.9);
      const ex = IBF.easeIn(IBF.seg(t, 3.5, 0.41)); // sortie vers la profondeur
      K.camT(this.cam, { z: 60 * IBF.easeInOut(u) - 760 * ex, ry: -3 + 3 * IBF.ease(u), rx: 2 * (1 - u) });
      const k = 1 - ex; // facteur de sortie
      const bl = ex * 12;

      // Barre : monte de la profondeur
      const pb = IBF.ep(t, 0.1, 0.8);
      K.pose(this.bar, {
        y: (1 - pb) * 110,
        z: (1 - pb) * -560,
        rx: 7 + (1 - pb) * 30,
        o: Math.min(1, pb * 1.8) * k,
        blur: (1 - pb) * 10 + bl
      });
      // reflet qui balaie la barre
      IBF.V(this.bar, '--sheen', IBF.fix(110 - 130 * IBF.easeInOut(IBF.seg(t, 0.9, 1.6)), 1) + '%');

      // Frappe
      let n = 0;
      while (n < TYPE.length && t >= TYPE[n]) n++;
      const txt = T.search.slice(0, n);
      if (this.qtext.textContent !== txt) this.qtext.textContent = txt;
      const typing = t >= TYPE[0] - 0.05 && t <= TYPE[TYPE.length - 1] + 0.08;
      const blink = Math.floor((t + 0.15) / 0.45) % 2 === 0;
      IBF.S(this.caret, 'opacity', typing || blink ? '1' : '0');

      // Clic sur le bouton (s'enfonce puis remonte)
      const down = IBF.seg(t, TP, 0.08), up = IBF.seg(t, TP + 0.08, 0.24);
      const press = t < TP ? 0 : t < TP + 0.08 ? IBF.easeOutCubic(down) : 1 - IBF.easeInOut(up);
      IBF.V(this.btn, '--ex', IBF.fix(12 - 9 * press, 2) + 'px');
      const glow = t < TP ? 0.2 * IBF.smooth(1.6, 1.95, t) : Math.max(0.35, 1 - IBF.seg(t, TP + 0.1, 0.9) * 0.65);
      IBF.V(this.btn, '--glow', IBF.fix(glow, 3));
      IBF.S(this.btn, 'transform', 'translateY(' + IBF.fix(press * 9, 2) + 'px)');
      IBF.V(this.bar, '--glow', IBF.fix(t < TP ? 0 : 0.8 * (1 - IBF.seg(t, TP, 0.8)), 3));

      // Titre : mot par mot, cascade de 60 ms
      const t0 = IBF.beat(3) + 0.13;
      this.words.forEach((w, i) => {
        const p = IBF.ep(t, t0 + i * 0.06, 0.62);
        K.rise(w, p, { dy: 70, dz: -180, rx: 75, blur: 8 }, k, { blur: bl });
      });
    }
  });
})();

<script>
/* 2 · Logo — 3,9 → 7,2 s
   Particules (fx.js) → le monogramme « IB » se solidifie sur le temps fort (5,87 s),
   onde de choc, halo, reflet qui balaie la surface, nom « IBFautomate ». */
(function () {
  'use strict';
  const IBF = window.IBF, K = IBF.kit, T = IBF.TXT;

  IBF.defineScene({
    index: 1,
    pre: 0.05,
    build(el) {
      const cam = (this.cam = K.cam(el));
      const M = IBF.LOGO_S2, k = M.size / 360;
      // halo derrière le logo
      const halo = (this.halo = IBF.el('div', 'abs', cam));
      halo.style.cssText =
        'left:' + (M.cx - 520) + 'px;top:' + (M.cy - 520) + 'px;width:1040px;height:1040px;border-radius:50%;' +
        'background:radial-gradient(circle, ' + IBF.rgba('accent', 0.34) + ' 0%, ' + IBF.rgba('accent', 0.12) + ' 34%, ' + IBF.rgba('accent', 0) + ' 68%);';
      // logo 3D
      this.logo = IBF.buildLogo(cam, { size: M.size, layers: 18, depth: 48 });
      const r = this.logo.root;
      r.style.left = IBF.fix(M.cx - (M.ux + 10) * k) + 'px';
      r.style.top = IBF.fix(M.cy - (M.uy + 10) * k) + 'px';
      r.style.transformOrigin = IBF.fix((M.ux + 10) * k) + 'px ' + IBF.fix((M.uy + 10) * k) + 'px';
      // nom de marque : « IBF » gras + « automate » léger
      const wm = (this.wm = IBF.el('div', 'line', cam));
      wm.style.top = '1090px';
      wm.style.fontSize = '104px';
      wm.style.letterSpacing = '-0.03em';
      this.letters = [];
      for (const ch of T.brandBold) {
        const s = IBF.el('span', 'word t-title', wm, ch);
        this.letters.push(s);
      }
      for (const ch of T.brandLight) {
        const s = IBF.el('span', 'word t-accent', wm, ch);
        s.style.fontWeight = '300';
        this.letters.push(s);
      }
    },
    render(t, fr) {
      const TI = IBF.T_IMPACT;
      const s = IBF.SCENES[1];
      const u = IBF.seg(t, s.start, s.end - s.start);
      // Caméra : orbite lente qui révèle l'épaisseur
      const ex = IBF.easeIn(IBF.seg(t, 6.93, 0.25));
      K.camT(this.cam, { z: 40 * u + 900 * ex, ry: 0, rx: 0 });
      const on = t >= TI - 0.001;
      this.logo.root.style.display = on ? 'block' : 'none';
      if (on) {
        const pop = 1 - IBF.ep(t, TI, 0.45, IBF.easeOutCubic);
        const ry = 16 - 21 * IBF.easeInOut(IBF.seg(t, s.start, 3.4));
        const rx = 9 - 6 * IBF.easeInOut(IBF.seg(t, s.start, 3.4));
        IBF.S(
          this.logo.root,
          'transform',
          'translateZ(' + IBF.fix(pop * 60) + 'px) rotateX(' + IBF.fix(rx, 3) + 'deg) rotateY(' + IBF.fix(ry, 3) + 'deg) scale(' + IBF.fix(1 + pop * 0.06, 4) + ')'
        );
        IBF.V(this.logo.root, '--lo', IBF.fix(1 - IBF.smooth(7.0, 7.17, t), 3));
        const sheen = -1 + 2 * IBF.easeInOut(IBF.seg(t, 6.0, 0.8));
        const dotU = ((t - 6.25) / 1.15) % 1;
        this.logo.update(sheen, IBF.ep(t, 5.95, 0.5), dotU < 0 ? 0 : dotU, IBF.smooth(6.25, 6.4, t));
      }
      // halo
      const ha = on ? Math.min(1, IBF.seg(t, TI, 0.3) * 1.2) * (0.85 + 0.15 * Math.sin((t - TI) * 5)) : 0.25 * IBF.smooth(4.6, TI, t);
      IBF.S(this.halo, 'opacity', String(IBF.fix(ha * (1 - ex), 3)));
      // nom : lettre par lettre (cascade 60 ms)
      this.letters.forEach((l, i) => {
        const p = IBF.ep(t, TI + 0.05 + i * 0.04, 0.5);
        K.rise(l, p, { dy: 50, dz: -140, rx: 65, blur: 6 }, 1 - ex);
      });
    }
  });
})();

  const IBF = window.IBF, K = IBF.kit, D = IBF.TXT.constat;

  const TC = [b(19), b(20), b(21)]; // arrivée des cartes (12,39 / 13,04 / 13,70 s)

  IBF.defineScene({

      const exT = IBF.easeIn(IBF.seg(t, 16.52, 0.4));

      const evap = [];
      this.cards.forEach((c, i) => {
        const p = IBF.ep(t, TC[i], 0.8);
        const q = 1 - p;
        const exi = IBF.easeIn(IBF.seg(t, 16.55 + i * 0.06, 0.34));

        K.pose(c.card, {
          y: q * 140,

          rx: q * -28 + 4,

          o: Math.min(1, p * 1.7) * (1 - exi),

        const pc = IBF.easeOutCubic(IBF.seg(t, cs[0], cs[1]));
        if (!c.def.big) {
          const v = Math.round(c.def.value * pc);
          const txt = v + c.def.suffix;
          if (c.num.textContent !== txt) c.num.textContent = txt;
        } else {
          // rouleau de chiffres flous, puis « Des milliers d'€ »
          const rolling = t >= cs[0] && t < cs[0] + cs[1];
          const done = t >= cs[0] + cs[1];
          if (rolling) {
            const f = Math.floor(t * 30);
            const r = IBF.rng(f * 7 + 3);
            let str = '';
            for (let k = 0; k < 6; k++) str += Math.floor(r() * 10);
            str = str.slice(0, 3) + ' ' + str.slice(3) + ' €';

          } else {
            IBF.S(c.roll, 'display', 'none');
            IBF.S(c.num._fin, 'display', done ? 'inline' : 'none');
            if (!done && c.roll.textContent !== '') c.roll.textContent = '';
          }
          const pop = done ? 1 - IBF.ep(t, cs[0] + cs[1], 0.35) : 0;
          IBF.S(c.num, 'transform', 'scale(' + IBF.fix(1 + pop * 0.08, 4) + ')');

        const g = K.env(t, cs[0] + cs[1] - 0.1, 0.15, 0.8);

        IBF.V(c.card, '--glow', IBF.fix(g * 0.5, 3));

        // zone d'évaporation (coordonnées écran approchées)
        const cx = camX;
        evap.push({
          x0: CARD.x + 200 + cx,
          x1: CARD.x + 200 + (c.def.big ? 520 : 250) + cx,
          y: CARD.y[i] + 44,
          a: p * (1 - exi) * 0.9,
          from: cs[0] + 0.5
        });
      });
      fr.evap = evap;
    }
  });
})();

        e.innerHTML = IBF.icon(bd.icon, { size: 36, stroke: 2.8 }) + '<span>' + bd.text + '</span>';
        return e;
      });
      this._laid = false;
    },
    layoutBadges() {
      const ws = this.badges.map((e) => e.offsetWidth);
      if (!ws[0]) return false;
      // 2 badges sur la première rangée, 1 centré dessous
      const gap = 18;
      const r1 = ws[0] + ws[1] + gap;
      let x = 540 - r1 / 2;
      [0, 1].forEach((i) => {
        this.badges[i].style.left = IBF.fix(x) + 'px';
        this.badges[i].style.top = '1244px';
        x += ws[i] + gap;
      });
      this.badges[2].style.left = IBF.fix(540 - ws[2] / 2) + 'px';
      this.badges[2].style.top = '1338px';
      this.badges.forEach((e) => (e.style.transformOrigin = '50% 50%'));

    },
    render(t, fr, el) {
      if (!this._laid) this._laid = this.layoutBadges();
      const s = IBF.SCENES[6];
      // caméra : lente rotation autour de la carte, revient de face avant le coup de caméra
      const ry = -4 + 7 * IBF.easeInOut(IBF.seg(t, s.start, 4.6)) - 3 * IBF.easeInOut(IBF.seg(t, 31.35, 0.6));
      // coup de caméra (transition) : la scène file vers la gauche avec un flou directionnel
      const w = IBF.easeIn(IBF.seg(t, WHIP, 0.62));
      K.camT(this.cam, { x: -1700 * w, z: 50 * IBF.seg(t, s.start, 5.2), ry: ry * (1 - w) });
      if (t >= WHIP) {
        fr.mblur = 90 * Math.sin(Math.min(1, IBF.seg(t, WHIP, 0.62)) * Math.PI * 0.5);
        IBF.S(el, 'filter', 'url(#ibf-mblur)');
        IBF.S(el, 'perspective', '1600px');
        IBF.S(el, 'perspectiveOrigin', '50% 46%');
      } else {
        IBF.S(el, 'filter', 'none');
        IBF.S(el, 'perspective', 'none');
      }
      // carte qui pivote
      const pc = IBF.ep(t, s.start - 0.05, 0.7);
      K.pose(this.card, { z: (1 - pc) * -260, ry: (1 - pc) * -58, o: Math.min(1, pc * 3) });
      IBF.V(this.card, '--sheen', IBF.fix(115 - 140 * IBF.easeInOut(IBF.seg(t, 27.1, 1.2)), 1) + '%');
      IBF.V(this.card, '--glow', IBF.fix(0.25 + 0.35 * IBF.beatPulse(t, s.start, WHIP, 5), 3));
      K.pose(this.av, { s: 0.55 + 0.45 * IBF.ep(t, 26.95, 0.5, IBF.bezier(0.34, 1.56, 0.64, 1)), o: IBF.seg(t, 26.95, 0.15) });
      K.rise(this.name, IBF.ep(t, 27.05, 0.5), { dy: 20, dz: -60, rx: 30, blur: 5 });
      K.pose(this.qm, { s: 0.6 + 0.4 * IBF.ep(t, 27.1, 0.5), o: IBF.seg(t, 27.1, 0.2) * 0.95 });
      this.lines.forEach((l, i) => K.rise(l, IBF.ep(t, QT[i], 0.55), { dy: 30, dz: -120, rx: 55, blur: 6 }));

      // courbe
      const pl = IBF.easeInOut(IBF.seg(t, b(44), 1.2));
      IBF.A(this.cLn, 'stroke-dashoffset', IBF.fix(this.cLen * (1 - pl), 1));
      IBF.A(this.cGlow, 'stroke-dashoffset', IBF.fix(this.cLen * (1 - pl), 1));
      IBF.A(this.cArea, 'opacity', String(IBF.fix(pl, 3)));
      const hp = this.samples[Math.round(pl * 100)];
      IBF.A(this.cHd, 'cx', IBF.fix(hp[0], 1));
      IBF.A(this.cHd, 'cy', IBF.fix(hp[1], 1));
      IBF.A(this.cHd, 'opacity', String(IBF.fix(pl > 0 ? 0.6 + 0.4 * Math.sin(t * 9) ** 2 : 0, 3)));

      // badges
      this.badges.forEach((e, i) => {
        const p = IBF.ep(t, BT[i], 0.55);
        K.pose(e, { y: (1 - p) * 50, z: (1 - p) * -200, rx: (1 - p) * -40, o: Math.min(1, p * 1.7) });
        IBF.V(e, '--glow', IBF.fix(K.env(t, BT[i], 0.1, 0.6), 3));
      });
    }
  });
})();

<script>
/* 8 · Transition — 32,0 → 33,9 s : portée par la scène 7 (sortie), direction.js
   (traînées, pivot du fond) et l'arrivée du titre ci-dessous.
   9 · Processus — 33,9 → 37,2 s : ligne verte lumineuse en circuit, un nœud par temps. */
(function () {
  'use strict';
  const IBF = window.IBF, K = IBF.kit, D = IBF.TXT.process, C = IBF.C;
  const b = IBF.beat;

  IBF.defineScene({ index: 7, build() {}, render() {} });

  // Tracé en « circuit » : sommets (coins arrondis) et nœuds des 5 étapes
  const NX = [250, 830, 250, 830, 250];
  const NY = [640, 820, 1000, 1180, 1360];
  const V = [[540, 500], [540, 560], [250, 560]];
  for (let i = 0; i < 5; i++) {
    V.push([NX[i], NY[i]]);
    if (i < 4) {
      V.push([NX[i], NY[i] + 90]);
      V.push([NX[i + 1], NY[i] + 90]);
    }
  }
  V.push([250, 1450], [540, 1450], [540, 1640]);
  const NODE_V = [3, 6, 9, 12, 15]; // indices des nœuds dans V
  const TK = [b(52), b(53), b(54), b(55), b(56)]; // 33,91 … 36,52 s

  // échantillonnage du tracé avec coins arrondis (rayon 34)
  function buildPath() {
    const R = 34;
    const pts = [];
    const nodeAt = [];
    let d = 'M' + V[0][0] + ' ' + V[0][1];
    pts.push(V[0].slice());
    for (let i = 1; i < V.length; i++) {
      const a = V[i - 1], c = V[i], n = V[i + 1];
      const isNode = NODE_V.indexOf(i) >= 0;
      if (!n || isNode || (a[0] === c[0] && c[0] === n[0]) || (a[1] === c[1] && c[1] === n[1])) {
        d += ' L' + c[0] + ' ' + c[1];
        seg(pts, pts[pts.length - 1], c);
        if (isNode) nodeAt.push(pts.length - 1);
        continue;
      }
      // coin : on s'arrête R avant, quadratique jusqu'à R après
      const inx = Math.sign(c[0] - a[0]), iny = Math.sign(c[1] - a[1]);
      const outx = Math.sign(n[0] - c[0]), outy = Math.sign(n[1] - c[1]);
      const p1 = [c[0] - inx * R, c[1] - iny * R], p2 = [c[0] + outx * R, c[1] + outy * R];
      d += ' L' + p1[0] + ' ' + p1[1] + ' Q' + c[0] + ' ' + c[1] + ' ' + p2[0] + ' ' + p2[1];
      seg(pts, pts[pts.length - 1], p1);
      for (let k = 1; k <= 8; k++) {
        const u = k / 8, q = 1 - u;
        pts.push([q * q * p1[0] + 2 * q * u * c[0] + u * u * p2[0], q * q * p1[1] + 2 * q * u * c[1] + u * u * p2[1]]);
      }
      V[i] = p2; // le segment suivant part de la fin du coin
    }
    // longueurs cumulées
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { d, pts, cum, nodeAt, len: cum[cum.length - 1] };
  }
  function seg(pts, a, c) {
    const L = Math.hypot(c[0] - a[0], c[1] - a[1]);
    const n = Math.max(1, Math.round(L / 12));
    for (let k = 1; k <= n; k++) pts.push([a[0] + ((c[0] - a[0]) * k) / n, a[1] + ((c[1] - a[1]) * k) / n]);
  }

  IBF.defineScene({
    index: 8,
    pre: 0.78,
    post: 0.2,
    build(el) {
      const cam = (this.cam = K.cam(el));
      const tg = (this.tg = IBF.el('div', 'p3 abs', cam));
      tg.style.cssText = 'left:0;top:0;width:1080px;height:600px;';
      this.t1 = K.line(tg, 236, 100, [['Votre'], ['projet']]);
      this.t2 = K.line(tg, 346, 100, [['en'], ['5 étapes', 't-accent']]);
      const P = (this.P = buildPath());
      const svg = (this.svg = K.abs(cam, '', 0, 0, 1080, 1920));
      let h =
        '<svg viewBox="0 0 1080 1920" width="1080" height="1920" style="overflow:visible">' +
        '<defs><filter id="prG" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>' +
        '<radialGradient id="prH"><stop offset="0" stop-color="' + C.text + '"/><stop offset="0.22" stop-color="' + C.accent + '" stop-opacity="0.95"/><stop offset="1" stop-color="' + C.accent + '" stop-opacity="0"/></radialGradient></defs>' +
        '<path d="' + P.d + '" fill="none" stroke="' + IBF.rgba('forest', 0.55) + '" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round" class="guide"/>' +
        '<path class="glow" d="' + P.d + '" fill="none" stroke="' + C.accent + '" stroke-width="14" filter="url(#prG)" opacity="0.8"/>' +
        '<path class="ln" d="' + P.d + '" fill="none" stroke="' + C.accent + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
      for (let i = 0; i < 5; i++) {
        h += '<circle class="halo" cx="' + NX[i] + '" cy="' + NY[i] + '" r="46" fill="url(#prH)" opacity="0"/>' +
          '<circle class="node" cx="' + NX[i] + '" cy="' + NY[i] + '" r="17" fill="' + C.bg + '" stroke="' + IBF.rgba('accent', 0.5) + '" stroke-width="5"/>';
      }
      h += '<circle class="hd" r="36" fill="url(#prH)"/></svg>';
      svg.innerHTML = h;
      this.guide = svg.querySelector('.guide');
      this.ln = svg.querySelector('.ln');
      this.glow = svg.querySelector('.glow');
      this.hd = svg.querySelector('.hd');
      this.nodes = svg.querySelectorAll('.node');
      this.halos = svg.querySelectorAll('.halo');
      [this.ln, this.glow].forEach((p) => p.setAttribute('stroke-dasharray', IBF.fix(P.len, 1) + ' ' + IBF.fix(P.len + 10, 1)));
      // jalons [temps, distance] : la tête atteint chaque nœud sur son temps
      const nd = P.nodeAt.map((i) => P.cum[i]);
      this.keys = [[33.3, 0]].concat(TK.map((tk, i) => [tk, nd[i]])).concat([[37.35, P.len]]);
      // pastilles des étapes
      this.pills = D.steps.map((name, i) => {
        const e = IBF.el('div', 'pill step', cam);
        e.style.cssText += 'top:' + (NY[i] - 52) + 'px;height:104px;font-size:42px;padding:0 34px 0 30px;gap:22px;';
        e.innerHTML = '<span class="num">0' + (i + 1) + '</span><span class="nm">' + name + '</span>';
        return e;
      });
      this._laid = false;
    },
    layout() {
      const ok = this.pills.every((e) => e.offsetWidth > 0);
      if (!ok) return false;
      this.pills.forEach((e, i) => {
        const w = e.offsetWidth;
        const left = NX[i] < 540 ? NX[i] + 52 : NX[i] - 52 - w;
        e.style.left = left + 'px';
        e.style.transformOrigin = (NX[i] < 540 ? '0%' : '100%') + ' 50%';
      });
      return true;
    },
    dist(t) {
      const k = this.keys;
      if (t <= k[0][0]) return 0;
      for (let i = 1; i < k.length; i++) {
        if (t <= k[i][0]) {
          const u = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
          return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * IBF.easeInOut(u);
        }
      }
      return k[k.length - 1][1];
    },
    pointAt(d) {
      const P = this.P, c = P.cum;
      let lo = 0, hi = c.length - 1;
      while (hi - lo > 1) {
        const m = (lo + hi) >> 1;
        if (c[m] < d) lo = m; else hi = m;
      }
      const u = c[hi] > c[lo] ? (d - c[lo]) / (c[hi] - c[lo]) : 0;
      return [P.pts[lo][0] + (P.pts[hi][0] - P.pts[lo][0]) * u, P.pts[lo][1] + (P.pts[hi][1] - P.pts[lo][1]) * u];
    },
    render(t, fr) {
      if (!this._laid) this._laid = this.layout();
      const P = this.P;
      const d = this.dist(t);
      const hp = this.pointAt(d);
      // caméra : suit doucement l'étincelle vers le bas
      const ex = IBF.easeIn(IBF.seg(t, 36.9, 0.28));
      K.camT(this.cam, { y: -(hp[1] - 900) * 0.04 - ex * 380, z: 20 });
      // titre : arrive par la droite en sortant du flou (fin du coup de caméra)
      const pa = IBF.ease(IBF.seg(t, 33.16, 0.75));
      const tb = (1 - pa) * 70;
      fr.mblur = Math.max(fr.mblur, tb);
      IBF.S(this.tg, 'filter', tb > 0.3 ? 'url(#ibf-mblur)' : 'none');
      K.pose(this.tg, { x: (1 - pa) * 520, o: Math.min(1, pa * 2) * (1 - ex) });
      // ligne
      IBF.A(this.ln, 'stroke-dashoffset', IBF.fix(P.len - d, 1));
      IBF.A(this.glow, 'stroke-dashoffset', IBF.fix(P.len - d, 1));
      IBF.A(this.guide, 'opacity', String(IBF.fix(IBF.smooth(33.3, 33.9, t) * 0.8 * (1 - ex), 3)));
      IBF.A(this.hd, 'cx', IBF.fix(hp[0], 1));
      IBF.A(this.hd, 'cy', IBF.fix(hp[1], 1));
      IBF.A(this.hd, 'opacity', String(IBF.fix(IBF.smooth(33.25, 33.45, t) * (1 - IBF.smooth(37.25, 37.4, t)), 3)));
      K.fade(this.svg, 1 - ex * 0.9, 0);
      // nœuds et pastilles
      const nd = P.nodeAt.map((i) => P.cum[i]);
      this.pills.forEach((e, i) => {
        const lit = d >= nd[i] - 0.5;
        const pl = IBF.ep(t, TK[i], 0.55);
        IBF.A(this.nodes[i], 'fill', lit ? C.accent : C.bg);
        IBF.A(this.nodes[i], 'stroke', lit ? C.accent : IBF.rgba('accent', 0.5));
        IBF.A(this.halos[i], 'opacity', String(IBF.fix(lit ? 0.45 + 0.55 * K.env(t, TK[i], 0.08, 0.7) : 0, 3)));
        K.pose(e, { z: (1 - pl) * -320, s: 0.86 + 0.14 * pl, o: Math.min(1, pl * 1.7) * (1 - ex), blur: (1 - pl) * 7 });
        IBF.V(e, '--glow', IBF.fix(K.env(t, TK[i], 0.1, 0.8), 3));
      });
    }
  });
})();

<script>
/* 10 · Appel à l'action — 37,2 → 40,0 s
   « Parlons de votre projet », bouton 3D vert « Réserver un échange » qui s'enfonce
   sur le temps, coordonnées en cascade, le logo se dissout en particules (fx.js). */
(function () {
  'use strict';
  const IBF = window.IBF, K = IBF.kit, D = IBF.TXT.cta;
  const S0 = IBF.SCENES[9].start; // 37,17 s
  const TP = IBF.T_PRESS2; // 37,83 s
  const BTN = { x: 150, y: 838, w: 780, h: 150 };

  IBF.defineScene({
    index: 9,
    pre: 0.05,
    build(el) {
      const cam = (this.cam = K.cam(el));
      const M = IBF.LOGO_S10, k = M.size / 360;
      this.logo = IBF.buildLogo(cam, { size: M.size, layers: 10, depth: 20 });
      const r = this.logo.root;
      r.style.left = IBF.fix(M.cx - (M.ux + 10) * k) + 'px';
      r.style.top = IBF.fix(M.cy - (M.uy + 10) * k) + 'px';
      r.style.transformOrigin = IBF.fix((M.ux + 10) * k) + 'px ' + IBF.fix((M.uy + 10) * k) + 'px';

      this.l1 = K.line(cam, 502, 112, [['Parlons'], ['de']]);
      this.l2 = K.line(cam, 622, 112, [['votre'], ['projet', 't-accent']]);

      const btn = (this.btn = IBF.el('div', 'cta-btn', cam, D.button));
      btn.style.cssText += 'left:' + BTN.x + 'px;top:' + BTN.y + 'px;width:' + BTN.w + 'px;height:' + BTN.h + 'px;font-size:50px;transform-origin:50% 50%;';

      const note = (this.note = IBF.el('div', 'contact', cam));
      note.style.top = '1036px';
      note.innerHTML = '<div class="row" style="font-size:30px;font-weight:300;color:rgba(242,245,243,0.78);gap:12px">' + IBF.icon('fast', { size: 36, stroke: 2.6 }) + D.note + '</div>';

      this.rows = [
        ['mail', D.email],
        ['phone', D.phone],
        ['globe', D.site]
      ].map((r, i) => {
        const c = IBF.el('div', 'contact', cam);
        c.style.top = 1146 + i * 104 + 'px';
        c.innerHTML = '<div class="row" style="font-size:42px"><div class="cicon">' + IBF.icon(r[0], { size: 36, stroke: 2.8 }) + '</div><span>' + r[1] + '</span></div>';
        return c;
      });
    },
    render(t, fr) {
      const u = IBF.seg(t, S0, 2.83);
      K.camT(this.cam, { z: 50 * IBF.easeInOut(u), rx: 5 - 2 * u });
      // logo : apparaît puis se dissout (39,0 s)
      const pl = IBF.ep(t, S0, 0.6);
      const fl = 1 - IBF.smooth(IBF.T_DISSOLVE, IBF.T_DISSOLVE + 0.42, t);
      IBF.S(this.logo.root, 'transform', 'translateY(' + IBF.fix((1 - pl) * 40 + Math.sin(t * 2.2) * 4) + 'px) translateZ(' + IBF.fix((1 - pl) * -200) + 'px) rotateY(' + IBF.fix(Math.sin(t * 1.3) * 10, 3) + 'deg) rotateX(8deg)');
      IBF.V(this.logo.root, '--lo', IBF.fix(Math.min(1, pl * 1.6) * fl, 3));
      this.logo.update(-1 + 2 * IBF.easeInOut(IBF.seg(t, 37.9, 0.8)), 1, ((t - 37.5) / 1.1) % 1, IBF.smooth(37.4, 37.6, t) * fl);
      // titre
      this.words.forEach((w, i) => K.rise(w, IBF.ep(t, S0 + i * 0.06, 0.58), { dy: 70, dz: -200, rx: 72 }));
      // bouton : monte, s'enfonce sur le temps, lueur pulsée
      const pb = IBF.ep(t, S0 + 0.1, 0.5);
      const down = IBF.seg(t, TP, 0.08), up = IBF.seg(t, TP + 0.08, 0.26);
      const press = t < TP ? 0 : t < TP + 0.08 ? IBF.easeOutCubic(down) : 1 - IBF.easeInOut(up);
      K.pose(this.btn, { y: (1 - pb) * 80 + press * 13, z: (1 - pb) * -260, rx: (1 - pb) * -30, s: 0.92 + 0.08 * pb, o: Math.min(1, pb * 1.7), blur: (1 - pb) * 6 });
      IBF.V(this.btn, '--ex', IBF.fix(20 - 14 * press, 2) + 'px');
      const glow = t < TP ? 0.3 * pb : 0.45 + 0.55 * Math.max(1 - IBF.seg(t, TP, 0.6), 0.5 + 0.5 * Math.sin((t - TP) * 6.5));
      IBF.V(this.btn, '--glow', IBF.fix(glow, 3));
      IBF.V(this.btn, '--sheen', IBF.fix(115 - 140 * IBF.easeInOut(IBF.seg(t, 38.25, 0.8)), 1) + '%');
      // mention + coordonnées (cascade 60 ms)
      K.rise(this.note, IBF.ep(t, 37.95, 0.5), { dy: 30, dz: -120, rx: 40, blur: 5 });
      this.rows.forEach((r, i) => K.rise(r, IBF.ep(t, 38.1 + i * 0.06, 0.55), { dy: 50, dz: -160, rx: 50, blur: 6 }));
      fr.floor.halo.x = 540;
    }
  });
})();
