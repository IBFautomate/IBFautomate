<script>
/* ==========================================================================
   audio.js : musique et bruitages 100 % générés par code (Web Audio API).
   Aucun échantillon, aucune boucle, aucune mélodie reprise.

   Électro ambient nocturne · 92 BPM · Ré mineur (couleur dorienne finale)
   Grille : Dm7 → B♭maj7 → Gm9 → Am7(♭5), un accord par mesure, variée à
   chaque boucle ; résolution finale sur Dm6/9.
   Motif original : Ré – La – Do – Sol (pentatonique de Ré), 4 temps de notes
   + 1 temps de silence → chaque reprise tombe un temps plus tard.

   Rendu hors ligne (OfflineAudioContext) : le même fichier sert à la lecture
   et à l'export MP4 → synchro image/son exacte.
   ========================================================================== */
(function () {
  'use strict';
  const IBF = (window.IBF = window.IBF || {});
  const B = IBF.BEAT;
  const beat = IBF.beat;
  const bar = IBF.bar;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------- Harmonie (mesure k = IBF.bar(k)) ---------- */
  const CHORDS = {
    2: { root: 38, pad: [50, 53, 60, 69] }, // Dm7 (impact du logo)
    3: { root: 34, pad: [50, 53, 58, 69] }, // B♭maj7
    4: { root: 31, pad: [50, 55, 58, 69] }, // Gm9
    5: { root: 33, pad: [51, 55, 60, 69] }, // Am7(♭5)
    6: { root: 38, pad: [50, 53, 60, 64, 69] }, // Dm9          (2e boucle : variée)
    7: { root: 34, pad: [50, 53, 58, 69, 72] }, // B♭maj9
    8: { root: 31, pad: [50, 55, 58, 60, 69] }, // Gm11
    9: { root: 33, pad: [51, 55, 60, 62, 69] }, // Am7(♭5, 11)
    10: { root: 38, pad: [50, 53, 57, 60, 64, 69, 76] }, // Dm9 large  (pic)
    11: { root: 34, pad: [46, 53, 58, 62, 69, 74] }, // B♭maj7 large
    12: { root: 31, pad: [50, 55, 58, 62, 69] }, // Gm9 (transition)
    13: { root: 33, pad: [51, 55, 60, 69] }, // Am7(♭5) tenu (processus)
    14: { root: 38, pad: [50, 53, 59, 64, 69] } // Dm6/9 : Si naturel = couleur dorienne
  };
  IBF.CHORDS = CHORDS;

  /* ---------- Événements utilisés aussi par l'image ---------- */
  const T_IMPACT = IBF.T_IMPACT; // 5,870 s
  const MOTIF = [74, 69, 72, 67]; // Ré5 La4 Do5 Sol4
  const MOTIF_STARTS = [13, 18, 23, 28, 33, 38, 43]; // en temps : décalage d'un temps à chaque reprise

  // Niveaux (mixage)
  const MIX = {
    music: 0.5,
    pad: 0.42,
    bass: 0.5,
    kick: 0.62,
    hat: 0.2,
    arp: 0.62,
    bell: 0.27,
    sfx: 1.0
  };

  function compose(ctx) {
    const SR = ctx.sampleRate;
    const DUR = IBF.DURATION;
    const rnd = IBF.rng(2024);

    // --- Planificateur : chaque événement crée ses nœuds juste avant de jouer,
    //     puis ils sont déconnectés une fois terminés (rendu rapide, même sur mobile).
    const events = [];
    let CUR = null;
    ['createGain', 'createBiquadFilter', 'createOscillator', 'createBufferSource', 'createStereoPanner', 'createWaveShaper'].forEach((k) => {
      if (!ctx[k]) return;
      const f = ctx[k].bind(ctx);
      ctx[k] = function () {
        const n = f.apply(null, arguments);
        if (CUR) CUR.push(n);
        return n;
      };
    });
    const at = (t0, t1, fn) => events.push({ t0, t1, fn });

    const G = (v, dest) => {
      const g = ctx.createGain();
      g.gain.value = v;
      if (dest) g.connect(dest);
      return g;
    };
    const BQ = (type, f, q, dest) => {
      const b = ctx.createBiquadFilter();
      b.type = type;
      b.frequency.value = f;
      if (q != null) b.Q.value = q;
      if (dest) b.connect(dest);
      return b;
    };
    const PAN = (v, dest) => {
      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (!p) return G(1, dest);
      p.pan.value = Math.max(-1, Math.min(1, v));
      if (dest) p.connect(dest);
      return p;
    };

    /* --- Bruit blanc (graine fixe) --- */
    const NOISE = ctx.createBuffer(1, SR * 3, SR);
    {
      const d = NOISE.getChannelData(0);
      const r = IBF.rng(77);
      for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    }
    function noise(t0, dur, dest) {
      const s = ctx.createBufferSource();
      s.buffer = NOISE;
      s.connect(dest);
      const off = rnd() * Math.max(0, NOISE.duration - dur - 0.05);
      s.start(t0, off, dur + 0.02);
      return s;
    }
    function osc(type, f, t0, t1, dest, det) {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = f;
      if (det) o.detune.value = det;
      o.connect(dest);
      o.start(t0);
      o.stop(t1);
      return o;
    }

    /* --- Chaîne master : limiteur (−1 dB) + fondu de sortie 1,5 s --- */
    const master = G(1);
    const lim = ctx.createDynamicsCompressor();
    lim.threshold.value = -3;
    lim.knee.value = 2;
    lim.ratio.value = 20;
    lim.attack.value = 0.001;
    lim.release.value = 0.1;
    const trim = G(0.89); // ≈ −1 dB de marge après le limiteur
    const fade = G(1);
    master.connect(lim);
    lim.connect(trim);
    trim.connect(fade);
    fade.connect(ctx.destination);
    fade.gain.setValueAtTime(1, 38.5);
    fade.gain.linearRampToValueAtTime(0.0001, DUR);

    /* --- Réverbération calculée (aucun fichier) --- */
    const conv = ctx.createConvolver();
    conv.buffer = makeIR(ctx, 4.2, 0.018);
    const verbIn = G(1, conv);
    const verbOut = G(0.85, master);
    conv.connect(verbOut);

    /* --- Bus musique, sidechain (courbes calculées) --- */
    const kicks = [];
    const ducks = []; // [temps, profondeur (0..1), relâche]
    const musicDuck = G(1, master);
    const music = G(MIX.music, musicDuck);
    const pump = G(1, music);
    const padBus = G(MIX.pad, pump);
    const bassIn = G(0.34);
    const bassSh = ctx.createWaveShaper();
    bassSh.curve = satCurve(2.2);
    bassSh.oversample = '2x';
    const bassLP = BQ('lowpass', 460, 0.7);
    bassIn.connect(bassSh);
    bassSh.connect(bassLP);
    const bassBus = G(MIX.bass, pump);
    bassLP.connect(bassBus);
    const drumBus = G(1, music);
    const hatL = PAN(-0.18, drumBus), hatR = PAN(0.18, drumBus);
    const arpBus = G(MIX.arp, music);
    const arpL = PAN(-0.35, arpBus), arpR = PAN(0.35, arpBus);
    const bellBus = G(MIX.bell, music);
    const sfx = G(MIX.sfx, master);
    // outil de mixage : écoute isolée d'un groupe (IBF.AUDIO_SOLO)
    if (IBF.AUDIO_SOLO) {
      const solo = IBF.AUDIO_SOLO;
      const map = { pad: padBus, bass: bassBus, drums: drumBus, arp: arpBus, bell: bellBus, sfx: sfx };
      for (const k in map) if (k !== solo) map[k].gain.value = 0;
    }
    // envois réverbe
    const padSend = G(0.32, verbIn);
    padBus.connect(padSend);
    const bellSend = G(0.55, verbIn);
    bellBus.connect(bellSend);
    const arpSend = G(0.22, verbIn);
    arpBus.connect(arpSend);
    const sfxSend = G(0.28, verbIn);
    sfx.connect(sfxSend);

    [padSend, bellSend].forEach((s) => {
      const v = s.gain.value;
      s.gain.setValueAtTime(v, 33.8);
      s.gain.linearRampToValueAtTime(v * 2.3, 35.0);
    });

    {
      const dl = ctx.createDelay(1.5), dr = ctx.createDelay(1.5);
      dl.delayTime.value = B * 0.75;
      dr.delayTime.value = B * 0.75;
      const fbL = G(0.34), fbR = G(0.34);
      const lpL = BQ('lowpass', 2600, 0.5), lpR = BQ('lowpass', 2600, 0.5);
      const pl = PAN(-0.75, music), pr = PAN(0.75, music);
      const wet = G(0.3);
      arpBus.connect(wet);
      wet.connect(dl);
      dl.connect(lpL);
      lpL.connect(fbL);
      fbL.connect(dr);
      dr.connect(lpR);
      lpR.connect(fbR);
      fbR.connect(dl);
      lpL.connect(pl);
      lpR.connect(pr);
    }

    /* ================= INSTRUMENTS ================= */
    function pad(t0, t1, notes, o) {
      o = Object.assign({ level: 1, attack: 0.5, release: 0.9, c0: 900, c1: 900, q: 0.5, width: 0.55, lfo: 160 }, o);
      const lfoRate = 0.15 + rnd() * 0.12;
      const dets = notes.map(() => [(rnd() - 0.5) * 5, (rnd() - 0.5) * 5, (rnd() - 0.5) * 5]);
      at(t0, t1 + o.release + 0.25, () => {
        const f = BQ('lowpass', o.c0, o.q);
        f.frequency.setValueAtTime(o.c0, t0);
        f.frequency.linearRampToValueAtTime(o.c1, t1 + o.release);
        const lfo = ctx.createOscillator();
        lfo.frequency.value = lfoRate;
        const lg = G(o.lfo);
        lfo.connect(lg);
        lg.connect(f.frequency);
        lfo.start(t0);
        lfo.stop(t1 + o.release + 0.2);
        const amp = G(0, o.bus || padBus);
        f.connect(amp);
        const per = 1 / Math.sqrt(notes.length * 3);
        // 3 groupes stéréo (gauche / centre / droite) au lieu d'un panoramique par voix
        const groups = [-1, 0, 1].map((d) => {
          const g = G(per);
          g.connect(PAN(d * o.width, f));
          return g;
        });
        notes.forEach((m, j) => {
          [-9, 0, 9].forEach((d, i) => osc('sawtooth', mtof(m), t0, t1 + o.release + 0.2, groups[i], d + dets[j][i]));
        });
        amp.gain.setValueAtTime(0, t0);
        amp.gain.linearRampToValueAtTime(o.level, t0 + o.attack);
        amp.gain.setValueAtTime(o.level, Math.max(t0 + o.attack, t1));
        amp.gain.linearRampToValueAtTime(0, t1 + o.release);
      });
    }

    function bassNote(t, dur, m, v) {
      at(t, t + dur + 0.25, () => {
        const amp = G(0, bassIn);
        osc('sine', mtof(m), t, t + dur + 0.2, amp);
        const hv = G(0.3, amp);
        osc('triangle', mtof(m + 12), t, t + dur + 0.2, hv);
        amp.gain.setValueAtTime(0, t);
        amp.gain.linearRampToValueAtTime(v, t + 0.012);
        amp.gain.setValueAtTime(v, t + Math.max(0.02, dur - 0.06));
        amp.gain.linearRampToValueAtTime(0, t + dur + 0.08);
      });
    }

    function kick(t, v) {
      kicks.push(t);
      at(t, t + 0.6, () => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(135, t);
        o.frequency.exponentialRampToValueAtTime(47, t + 0.13);
        const g = G(0, drumBus);
        o.connect(g);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v * MIX.kick, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0006, t + 0.5);
        o.start(t);
        o.stop(t + 0.55);
        const cg = G(0, drumBus);
        noise(t, 0.02, BQ('bandpass', 2600, 0.9, cg));
        cg.gain.setValueAtTime(v * 0.12, t);
        cg.gain.exponentialRampToValueAtTime(0.0004, t + 0.015);
      });
    }

    function hat(t, v, open) {
      const side = rnd() < 0.5 ? hatL : hatR;
      at(t, t + (open ? 0.4 : 0.1), () => {
        const g = G(0, side);
        const bp = BQ('bandpass', 10500, 0.9, g);
        noise(t, open ? 0.32 : 0.07, BQ('highpass', 7000, 0.7, bp));
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v * MIX.hat, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0005, t + (open ? 0.26 : 0.055));
      });
    }

    function arp(t, m, v, cut, pan) {
      const side = pan < 0 ? arpL : arpR;
      at(t, t + 0.42, () => {
        const g = G(0, side);
        const f = BQ('lowpass', cut, 5, g);
        f.frequency.setValueAtTime(Math.min(12000, cut * 2.4), t);
        f.frequency.exponentialRampToValueAtTime(cut, t + 0.09);
        osc('square', mtof(m), t, t + 0.4, f);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v * 0.6, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.3);
      });
    }

    // cloche FM douce (motif, tintements)
    function bell(t, m, v, dur, dest, ratio, bright) {
      at(t, t + dur + 0.1, () => {
        const f = mtof(m);
        const car = ctx.createOscillator();
        car.frequency.value = f;
        const mod = ctx.createOscillator();
        mod.frequency.value = f * (ratio || 2);
        const mg = G(0);
        mod.connect(mg);
        mg.connect(car.frequency);
        mg.gain.setValueAtTime(f * (bright || 2.0), t);
        mg.gain.exponentialRampToValueAtTime(f * 0.05, t + dur * 0.55);
        const g = G(0, dest || bellBus);
        car.connect(g);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
        car.start(t);
        mod.start(t);
        car.stop(t + dur + 0.05);
        mod.stop(t + dur + 0.05);
        const g2 = G(0, dest || bellBus);
        osc('sine', f * 2, t, t + dur * 0.6, g2);
        g2.gain.setValueAtTime(0, t);
        g2.gain.linearRampToValueAtTime(v * 0.25, t + 0.003);
        g2.gain.exponentialRampToValueAtTime(0.0005, t + dur * 0.55);
      });
    }

    /* ================= BRUITAGES ================= */
    function keyClick(t, v, space) {
      at(t, t + 0.08, () => {
        const g = G(0, PAN((rnd() - 0.5) * 0.3, sfx));
        noise(t, 0.035, BQ('bandpass', space ? 1500 : 2300 + rnd() * 1400, 1.3, g));
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + 0.001);
        g.gain.exponentialRampToValueAtTime(0.0004, t + 0.03);
        const th = G(0, sfx);
        osc('sine', space ? 140 : 170 + rnd() * 40, t, t + 0.05, th);
        th.gain.setValueAtTime(0, t);
        th.gain.linearRampToValueAtTime(v * 0.9, t + 0.002);
        th.gain.exponentialRampToValueAtTime(0.0004, t + 0.035);
      });
    }
    function click(t, v) {
      at(t, t + 0.2, () => {
        [0, 0.085].forEach((dt, i) => {
          const g = G(0, sfx);
          noise(t + dt, 0.02, BQ('bandpass', i ? 3200 : 2400, 1.1, g));
          g.gain.setValueAtTime(0, t + dt);
          g.gain.linearRampToValueAtTime(v * (i ? 0.6 : 1), t + dt + 0.001);
          g.gain.exponentialRampToValueAtTime(0.0004, t + dt + 0.018);
          const b = G(0, sfx);
          osc('sine', i ? 900 : 620, t + dt, t + dt + 0.04, b);
          b.gain.setValueAtTime(0, t + dt);
          b.gain.linearRampToValueAtTime(v * 0.5, t + dt + 0.001);
          b.gain.exponentialRampToValueAtTime(0.0004, t + dt + 0.03);
        });
      });
    }
    // whoosh centré sur tc (bruit filtré en balayage + panoramique gauche → droite)
    function whoosh(tc, dur, v, o) {
      o = o || {};
      const t0 = tc - dur * 0.62, t1 = tc + dur * 0.38;
      at(t0, t1 + 0.15, () => {
        const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        const g = G(0, p || sfx);
        if (p) {
          p.connect(sfx);
          p.pan.setValueAtTime(o.from != null ? o.from : -0.7, t0);
          p.pan.linearRampToValueAtTime(o.to != null ? o.to : 0.7, t1);
        }
        const bp = BQ('bandpass', 300, o.q || 0.85, g);
        bp.frequency.setValueAtTime(o.f0 || 260, t0);
        bp.frequency.exponentialRampToValueAtTime(o.f1 || 2600, tc);
        bp.frequency.exponentialRampToValueAtTime(o.f2 || 650, t1);
        noise(t0, dur + 0.05, bp);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(v, tc);
        g.gain.exponentialRampToValueAtTime(0.0004, t1);
        if (o.body) {
          const bg = G(0, sfx);
          const s = osc('sine', 90, t0, t1 + 0.1, bg);
          s.frequency.setValueAtTime(70, t0);
          s.frequency.exponentialRampToValueAtTime(140, tc);
          s.frequency.exponentialRampToValueAtTime(45, t1);
          bg.gain.setValueAtTime(0.0001, t0);
          bg.gain.exponentialRampToValueAtTime(v * o.body, tc);
          bg.gain.exponentialRampToValueAtTime(0.0004, t1);
        }
      });
    }
    function pop(t, m, v) {
      at(t, t + 0.3, () => {
        const g = G(0, sfx);
        const o = osc('sine', mtof(m) * 2, t, t + 0.25, g);
        o.frequency.setValueAtTime(mtof(m) * 1.9, t);
        o.frequency.exponentialRampToValueAtTime(mtof(m), t + 0.035);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0005, t + 0.2);
        const c = G(0, sfx);
        noise(t, 0.012, BQ('highpass', 3000, 0.7, c));
        c.gain.setValueAtTime(v * 0.25, t);
        c.gain.exponentialRampToValueAtTime(0.0004, t + 0.01);
      });
    }
    function ting(t, m1, m2, v) {
      bell(t, m1, v, 0.9, sfx, 3.01, 1.4);
      bell(t + 0.075, m2, v * 0.85, 1.2, sfx, 3.01, 1.4);
    }
    function tick(t, v) {
      at(t, t + 0.03, () => {
        const g = G(0, sfx);
        noise(t, 0.008, BQ('bandpass', 3400, 1.1, g));
        g.gain.setValueAtTime(v * 1.3, t);
        g.gain.exponentialRampToValueAtTime(0.0003, t + 0.008);
      });
    }
    function riser(t0, t1, v) {
      at(t0, t1 + 0.05, () => {
        const g = G(0, sfx);
        const bp = BQ('bandpass', 400, 1.2, g);
        bp.frequency.setValueAtTime(380, t0);
        bp.frequency.exponentialRampToValueAtTime(7500, t1);
        noise(t0, t1 - t0 + 0.02, bp);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(v, t1 - 0.02);
        g.gain.linearRampToValueAtTime(0, t1);

        const tg = G(0, sfx);
        const trem = G(1, tg);
        const s = osc('sawtooth', 180, t0, t1, BQ('lowpass', 2400, 0.8, trem));
        s.frequency.setValueAtTime(147, t0);
        s.frequency.exponentialRampToValueAtTime(587, t1);
        const lfo = ctx.createOscillator();
        lfo.frequency.setValueAtTime(4, t0);
        lfo.frequency.exponentialRampToValueAtTime(18, t1);
        const lg = G(0.5);
        lfo.connect(lg);
        lg.connect(trem.gain);
        lfo.start(t0);
        lfo.stop(t1);
        tg.gain.setValueAtTime(0.0001, t0);
        tg.gain.exponentialRampToValueAtTime(v * 0.28, t1 - 0.02);
        tg.gain.linearRampToValueAtTime(0, t1);
      });
    }
    function impact(t, v) {
      ducks.push([t, 0.58, 0.55]);
      at(t, t + 1.9, () => {
        const g = G(0, sfx);
        const s = osc('sine', 58, t, t + 1.8, g);
        s.frequency.setValueAtTime(62, t);
        s.frequency.exponentialRampToValueAtTime(33, t + 1.0);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0005, t + 1.7);
        const n = G(0, sfx);
        noise(t, 0.9, BQ('lowpass', 900, 0.7, n));
        n.gain.setValueAtTime(v * 0.55, t);
        n.gain.exponentialRampToValueAtTime(0.0005, t + 0.8);
        const tr = G(0, sfx);
        noise(t, 0.03, BQ('bandpass', 1800, 0.8, tr));
        tr.gain.setValueAtTime(v * 0.5, t);
        tr.gain.exponentialRampToValueAtTime(0.0005, t + 0.025);
        const vs = G(0, verbIn);
        noise(t, 0.4, BQ('lowpass', 2500, 0.5, vs));
        vs.gain.setValueAtTime(v * 0.7, t);
        vs.gain.exponentialRampToValueAtTime(0.0005, t + 0.35);
      });
    }
    function shimmer(t0, t1, v, from, to) {
      at(t0, t1 + 0.2, () => {
        const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        const g = G(0, p || sfx);
        if (p) {
          p.connect(sfx);
          p.pan.setValueAtTime(from, t0);
          p.pan.linearRampToValueAtTime(to, t1);
        }
        const bp = BQ('bandpass', 7000, 2.2, g);
        bp.frequency.setValueAtTime(5500, t0);
        bp.frequency.exponentialRampToValueAtTime(11000, t1);
        noise(t0, t1 - t0 + 0.05, bp);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(v, (t0 + t1) / 2);
        g.gain.exponentialRampToValueAtTime(0.0004, t1);
        const n = Math.round((t1 - t0) * 16);
        for (let i = 0; i < n; i++) {
          const tt = t0 + rnd() * (t1 - t0);
          const pg = G(0, sfx);
          osc('sine', 3000 + rnd() * 5000, tt, tt + 0.12, pg);
          pg.gain.setValueAtTime(0, tt);
          pg.gain.linearRampToValueAtTime(v * 0.35, tt + 0.003);
          pg.gain.exponentialRampToValueAtTime(0.0003, tt + 0.1);
        }
      });
    }
    function swell(t0, t1, v) {
      at(t0, t1 + 0.05, () => {
        const g = G(0, sfx);
        const lp = BQ('lowpass', 300, 0.8, g);
        lp.frequency.setValueAtTime(260, t0);
        lp.frequency.exponentialRampToValueAtTime(9000, t1);
        noise(t0, t1 - t0 + 0.02, BQ('highpass', 180, 0.6, lp));
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(v, t1 - 0.015);
        g.gain.linearRampToValueAtTime(0, t1);
      });
    }

    /* ================= ARRANGEMENT ================= */
    const barT = (k) => bar(k);
    const lastBar = 14;

    // --- Intro : nappe grave sur Ré + pulsation sourde (0 → 5,87 s)
    pad(0, T_IMPACT - 0.1, [38, 50, 57, 62], { level: 0.9, attack: 2.2, release: 0.5, c0: 260, c1: 900, lfo: 60 });
    pad(beat(5), T_IMPACT - 0.06, [53, 64, 69], { level: 0.45, attack: 1.4, release: 0.3, c0: 500, c1: 2600, lfo: 200 });
    for (let n = 1; n <= 8; n++) {
      const t = beat(n);
      at(t, t + 0.45, () => {
      const g = G(0, pump);
      const s = osc('sine', 62, t, t + 0.4, g);
      s.frequency.setValueAtTime(78, t);
      s.frequency.exponentialRampToValueAtTime(52, t + 0.2);
      const v = 0.34 * (n <= 5 ? 1 : 0.7);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.35);
      });
    }

    // --- Accords (mesure 2 → fin)
    for (let k = 2; k <= lastBar; k++) {
      const c = CHORDS[k];
      const t0 = barT(k) - (k === 2 ? 0 : 0.12);
      const t1 = k === lastBar ? DUR + 0.5 : barT(k + 1);
      const peak = k === 10 || k === 11;
      const calm = k >= 12;
      const lvl = k === 2 ? 1.0 : peak ? 1.12 : k === 12 ? 0.8 : calm ? 0.62 : 0.82 + (k - 3) * 0.02;
      // la brillance du pad s'ouvre au fil du morceau
      const c0 = k === 2 ? 2600 : peak ? 2600 : calm ? 1400 : 900 + (k - 3) * 120;
      const c1 = k === 2 ? 1200 : peak ? 3000 : calm ? 900 : 1000 + (k - 3) * 130;
      pad(t0, t1, c.pad, { level: lvl, attack: k === 2 ? 0.03 : 0.35, release: k === lastBar ? 0.2 : 0.7, c0, c1, width: peak ? 0.9 : 0.55, lfo: peak ? 300 : 160 });
      if (peak) pad(t0, t1, c.pad.map((m) => m + 12).slice(-3), { level: 0.35, attack: 0.5, release: 0.8, c0: 3500, c1: 5200, width: 1 });
    }

    // --- Impact du logo + riser + scintillement
    riser(IBF.SCENES[1].start, T_IMPACT, 0.34);
    impact(T_IMPACT, 1.05);
    shimmer(6.0, 6.85, 0.1, -0.6, 0.6);

    // --- Kick : levée (7,17 / 7,83 s) puis groove sur 1 et 3, pic en quatre temps
    kick(beat(11), 0.55);
    kick(beat(12), 0.7);
    for (let n = 13; n < 49; n++) {
      const inBar = (n - 1) % 4; // 0 = premier temps
      const peak = n >= 41;
      if (peak || inBar === 0 || inBar === 2) kick(beat(n), peak ? 0.95 : inBar === 0 ? 0.9 : 0.78);
      // petite note fantôme avant le 3e temps (mesures 6 → 9)
      if (!peak && n >= 25 && inBar === 1) kick(beat(n + 0.75), 0.32);
    }

    // --- Basse (mesure 3 → fin)
    for (let k = 3; k <= lastBar; k++) {
      const c = CHORDS[k];
      const t = barT(k);
      if (k >= 12) {
        // calme : notes tenues
        const d = k === lastBar ? DUR - t + 0.2 : 4 * B - 0.05;
        bassNote(t, d, c.root, k === 12 ? 0.5 : k === lastBar ? 0.3 : 0.34);
        continue;
      }
      bassNote(t, 1.4 * B, c.root, 0.8);
      bassNote(t + 1.5 * B, 0.42 * B, c.root, 0.55);
      bassNote(t + 2 * B, 1.4 * B, c.root, 0.72);
      bassNote(t + 3.5 * B, 0.42 * B, c.root + 12, 0.5);
    }

    // --- Arpège : croches puis doubles-croches, filtre qui s'ouvre
    for (let k = 3; k <= 11; k++) {
      const c = CHORDS[k];
      const tones = arpTones(c.pad);
      const sixteen = k >= 6;
      const steps = sixteen ? 16 : 8;
      const pat = sixteen ? [0, 2, 4, 1, 3, 5, 2, 4, 6, 3, 5, 2, 4, 1, 3, 0] : [0, 2, 1, 3, 2, 4, 3, 5];
      for (let i = 0; i < steps; i++) {
        const t = barT(k) + (i * 4 * B) / steps;
        const prog = IBF.clamp((t - 8.4) / (26.7 - 8.4));
        const peak = k >= 10;
        const cut = peak ? 4200 : 850 * Math.pow(4.2, prog);
        const acc = i % (steps / 4) === 0 ? 1 : sixteen && i % 2 === 1 ? 0.55 : 0.72;
        const m = tones[pat[i] % tones.length];
        arp(t, m, acc * (0.8 + 0.2 * prog) * (peak ? 1.1 : 1), cut, i % 2 ? 0.35 : -0.35);
      }
    }

    // --- Motif (cloche) : Ré La Do Sol, décalé d'un temps à chaque reprise
    MOTIF_STARTS.forEach((s0, r) => {
      MOTIF.forEach((m, i) => {
        const t = beat(s0 + i);
        const peak = t > 26.7;
        bell(t, m + (peak ? 12 : 0), 1.0 * (i === 0 ? 1 : 0.8), 1.6, bellBus, 2, 1.8);
        if (peak) bell(t, m, 0.55, 1.4, bellBus, 2, 1.2);
      });
    });

    // --- Hi-hats : montée discrète puis pic
    for (let n = 37; n < 49; n++) {
      for (let s = 0; s < 4; s++) {
        const t = beat(n + s / 4);
        const peak = n >= 41;
        if (!peak) {
          if (s === 2) hat(t, 0.45 + 0.35 * ((n - 37) / 4), false);
          continue;
        }
        const inBar = (n - 1) % 4;
        if (s === 2) hat(t, 1.0, inBar === 3);
        else hat(t, s === 0 ? 0.55 : 0.35, false);
      }
    }
    // montée inversée vers le pic et vers le processus
    swell(beat(38.5), beat(41) - 0.01, 0.16);
    swell(32.55, IBF.SCENES[8].start - 0.01, 0.2);

    /* ---------- Bruitages synchronisés à l'image ---------- */
    // frappes clavier
    (IBF.TYPE_TIMES || []).forEach((t, i) => keyClick(t, 0.13, IBF.TXT.search[i] === ' '));
    // clic de la recherche + petit tintement
    click(IBF.T_PRESS1, 0.34);
    ting(IBF.T_PRESS1 + 0.03, 81, 86, 0.1);
    // whoosh à chaque transition
    whoosh(3.8, 0.7, 0.22, { from: 0.6, to: -0.6 });
    whoosh(7.05, 0.6, 0.2, { f1: 3200 });
    whoosh(11.62, 0.55, 0.18);
    whoosh(16.82, 0.6, 0.2, { from: -0.7, to: 0.7 });
    whoosh(21.85, 0.8, 0.26, { f1: 1800, body: 0.5 });
    whoosh(26.55, 0.6, 0.2, { from: 0.7, to: -0.7 });
    whoosh(32.12, 0.95, 0.42, { from: 0.9, to: -0.9, f0: 200, f1: 3400, f2: 500, body: 0.8 });
    ducks.push([32.0, 0.35, 0.5]);
    whoosh(33.42, 0.6, 0.12, { from: -0.8, to: 0.2 });
    whoosh(37.05, 0.5, 0.16);
    // mots de la promesse : « tic » feutré par groupe
    [11, 11.5, 12, 13, 13.5, 14].forEach((n) => {
      const t = beat(n);
      at(t, t + 0.08, () => {
        const g = G(0, sfx);
        noise(t, 0.05, BQ('bandpass', 1100, 1.4, g));
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.17, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0004, t + 0.05);
      });
    });
    // constat : pops des cartes (La, Do, Ré) + compteurs
    [beat(19), beat(20), beat(21)].forEach((t, i) => pop(t, [69, 72, 74][i], 0.2));
    counterTicks(12.55, 1.0, 80, 0.05);
    counterTicks(13.2, 1.0, 15, 0.055);
    for (let t = 13.85; t < 14.8; t += 1 / 30) tick(t, 0.035);
    ting(14.8, 86, 93, 0.08);
    // services : 7 pops accordés qui montent la gamme de Ré
    const svcPops = [[beat(27), 74], [beat(27) + 0.06, 77], [beat(28), 79], [beat(28) + 0.06, 81], [beat(29), 84], [beat(29) + 0.06, 86], [beat(30), 89]];
    svcPops.forEach((p) => pop(p[0], p[1], 0.17));
    // tableau de bord : compteurs + 4 notifications
    counterTicks(22.55, 1.25, 124, 0.045);
    [[beat(36), 81, 86], [beat(37), 84, 89], [beat(38), 86, 91], [beat(39), 89, 93]].forEach((n) => ting(n[0], n[1], n[2], 0.13));
    // témoignage : pop de la carte, montée avec la courbe, badges
    pop(IBF.SCENES[6].start, 74, 0.18);
    {
      const t0 = beat(44), t1 = t0 + 1.2;
      at(t0, t1 + 0.25, () => {
      const g = G(0, sfx);
      const s = osc('sine', 300, t0, t1 + 0.2, BQ('lowpass', 2000, 0.6, g));
      s.frequency.setValueAtTime(294, t0);
      s.frequency.exponentialRampToValueAtTime(880, t1);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.05, t1 - 0.2);
      g.gain.exponentialRampToValueAtTime(0.0004, t1 + 0.15);
      });
      shimmer(t0 + 0.2, t1, 0.05, -0.5, 0.6);
    }
    [[beat(45), 77], [beat(46), 79], [beat(47), 81]].forEach((p) => pop(p[0], p[1], 0.15));
    // processus : 5 tintements cristallins qui montent la gamme (Ré Fa Sol La Do)
    [74, 77, 79, 81, 84].forEach((m, i) => bell(beat(52 + i), m + 12, 0.12, 2.4, sfx, 3.01, 1.2));
    // appel à l'action : clic du bouton + note finale (Ré aigu)
    click(IBF.T_PRESS2, 0.36);
    ducks.push([IBF.T_PRESS2, 0.3, 0.45]);
    bell(IBF.T_PRESS2 + 0.02, 86, 0.2, 3.2, sfx, 2, 1.6);
    bell(IBF.T_PRESS2 + 0.02, 74, 0.12, 3.2, sfx, 2, 1.0);
    // dissolution du logo : scintillement léger
    shimmer(38.95, 39.95, 0.05, -0.3, 0.3);

    function counterTicks(t0, dur, N, v) {
      let last = -1, lt = -1;
      for (let t = t0; t <= t0 + dur; t += 0.002) {
        const val = Math.round(N * IBF.easeOutCubic((t - t0) / dur));
        if (val !== last && t - lt >= 0.028) {
          tick(t, v);
          last = val;
          lt = t;
        }
      }
    }

    /* ---------- Sidechain : courbes calculées ---------- */
    const RATE = 400;
    const nC = Math.ceil(DUR * RATE) + 1;
    const duckC = new Float32Array(nC).fill(1);
    const pumpC = new Float32Array(nC).fill(1);
    for (const d of ducks) applyDip(duckC, d[0], d[1], 0.012, d[2]);
    for (const t of kicks) applyDip(pumpC, t, 0.32, 0.008, 0.16);
    function applyDip(C, t, depth, att, rel) {
      const i0 = Math.max(0, Math.floor((t - att) * RATE));
      const i1 = Math.min(nC - 1, Math.ceil((t + rel * 3) * RATE));
      for (let i = i0; i <= i1; i++) {
        const tt = i / RATE;
        let e;
        if (tt < t) e = (tt - (t - att)) / att;
        else e = Math.exp(-(tt - t) / (rel / 2.5));
        e = IBF.clamp(e);
        C[i] = Math.min(C[i], 1 - depth * e);
      }
    }
    musicDuck.gain.setValueCurveAtTime(duckC, 0, DUR);
    pump.gain.setValueCurveAtTime(pumpC, 0, DUR);

    events.sort((a, b) => a.t0 - b.t0);
    return {
      events,
      begin(list) {
        CUR = list;
      },
      end() {
        CUR = null;
      }
    };
  }

  // notes d'arpège : tons de l'accord sur deux octaves (Ré4 → Ré6)
  function arpTones(pad) {
    const set = new Set();
    pad.forEach((m) => {
      [12, 24].forEach((o) => {
        const x = m + o;
        if (x >= 60 && x <= 88) set.add(x);
      });
    });
    return Array.from(set).sort((a, b) => a - b);
  }

  // saturation douce (harmoniques de la basse, audibles sur téléphone)
  function satCurve(k) {
    const n = 2048, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(k * x) / Math.tanh(k);
    }
    return c;
  }

  // réponse impulsionnelle stéréo générée (bruit décroissant qui s'assombrit)
  function makeIR(ctx, secs, pre) {
    const SR = ctx.sampleRate;
    const len = Math.floor(SR * secs);
    const ir = ctx.createBuffer(2, len, SR);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      const r = IBF.rng(101 + ch * 17);
      let lp = 0;
      const p0 = Math.floor(pre * SR);
      for (let i = 0; i < len; i++) {
        if (i < p0) {
          d[i] = 0;
          continue;
        }
        const t = (i - p0) / SR;
        const decay = Math.exp(-t * (6.9 / (secs * 0.8)));
        const a = Math.min(0.9, 0.15 + t * 0.35); // s'assombrit avec le temps
        lp = lp * a + (r() * 2 - 1) * (1 - a);
        d[i] = lp * decay * (1 + 0.4 * (1 - Math.min(1, t * 8)));
      }
    }
    return ir;
  }

  /* ---------- API ---------- */
  IBF.renderAudio = function (opts) {
    opts = opts || {};
    const SR = opts.sampleRate || 48000;
    const onProgress = opts.onProgress || function () {};
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return Promise.reject(new Error('Web Audio indisponible'));
    const DUR = IBF.DURATION;
    const ctx = new OAC(2, Math.ceil(SR * DUR), SR);
    const plan = compose(ctx);
    const ev = plan.events;
    let ei = 0;
    const live = [];
    const LOOK = 0.9;
    function build(upTo) {
      while (ei < ev.length && ev[ei].t0 < upTo) {
        const e = ev[ei++];
        const list = [];
        plan.begin(list);
        e.fn();
        plan.end();
        e.nodes = list;
        live.push(e);
      }
    }
    function sweep(now) {
      for (let i = live.length - 1; i >= 0; i--) {
        const e = live[i];
        if (e.t1 < now - 0.02) {
          for (const n of e.nodes) {
            try { n.disconnect(); } catch (err) { /* déjà déconnecté */ }
          }
          live.splice(i, 1);
        }
      }
    }
    const canSuspend = typeof ctx.suspend === 'function' && !opts.noSuspend;
    if (canSuspend) {
      build(LOOK);
      const q = 128 / SR;
      const CH = 0.5;
      for (let tb = CH; tb < DUR - 0.01; tb += CH) {
        const ts = Math.round(tb / q) * q;
        ctx.suspend(ts).then(() => {
          sweep(ts);
          build(ts + LOOK);
          onProgress(ts / DUR);
          ctx.resume();
        });
      }
    } else {
      build(DUR + 10);
    }
    return new Promise((resolve, reject) => {
      let done = false;
      const finish = (b) => {
        if (done) return;
        done = true;
        onProgress(1);
        resolve(b);
      };
      ctx.oncomplete = (e) => finish(e.renderedBuffer);
      const p = ctx.startRendering();
      if (p && p.then) p.then(finish, reject);
    });
  };

  // Encodage WAV (PCM 16 bits ou flottant 32 bits)
  IBF.encodeWAV = function (buf, float32) {
    const ch = buf.numberOfChannels, SR = buf.sampleRate, n = buf.length;
    const bps = float32 ? 4 : 2;
    const data = n * ch * bps;
    const ab = new ArrayBuffer(44 + data);
    const v = new DataView(ab);
    const ws = (o, s) => {
      for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
    };
    ws(0, 'RIFF');
    v.setUint32(4, 36 + data, true);
    ws(8, 'WAVE');
    ws(12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, float32 ? 3 : 1, true);
    v.setUint16(22, ch, true);
    v.setUint32(24, SR, true);
    v.setUint32(28, SR * ch * bps, true);
    v.setUint16(32, ch * bps, true);
    v.setUint16(34, bps * 8, true);
    ws(36, 'data');
    v.setUint32(40, data, true);
    const chans = [];
    for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
    let o = 44;
    const r = IBF.rng(5);
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < ch; c++) {
        const s = chans[c][i];
        if (float32) {
          v.setFloat32(o, s, true);
        } else {
          const d = (r() - r()) / 32768; // tramage TPDF
          const x = Math.max(-1, Math.min(1, s + d));
          v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
        }
        o += bps;
      }
    }
    return ab;
  };
})();

</script>
<script>
/* ==========================================================================
   player.js : lecteur responsive + mode export.
   - Téléphone vertical : plein écran, contrôles tactiles qui se masquent.
   - Téléphone horizontal : vidéo sur toute la hauteur, contrôles à côté.
   - Tablette : vidéo centrée, scènes en pastilles.
   - Ordinateur : vidéo centrée + liste des 10 scènes + raccourcis clavier.
   - ?export=1 : aucune interface, rendu image par image pour l'export MP4.
   ========================================================================== */
(function () {
  'use strict';
  const IBF = window.IBF;
  const Q = new URLSearchParams(location.search);
  const EXPORT = Q.has('export');
  const DUR = IBF.DURATION;

  const ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4L19.5 12z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>',
    replay: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>',
    sound: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>',
    muted: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
    full: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    unfull: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
    list: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>'
  };

  const fmt = (t) => {
    t = Math.max(0, Math.min(DUR, t));
    const s = Math.floor(t);
    return '0:' + String(s).padStart(2, '0');
  };

  async function fontsReady() {
    try {
      await Promise.all(['300', '400', '500', '600', '700', '800'].map((w) => document.fonts.load(w + ' 50px Sora')));
      await document.fonts.ready;
    } catch (e) {
      /* police déjà intégrée : on continue */
    }
  }

  function b64(ab) {
    const u8 = new Uint8Array(ab);
    let s = '';
    const CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  }

  /* =================== MODE EXPORT =================== */
  function initExport() {
    document.body.classList.add('export');
    const app = document.getElementById('app');
    app.innerHTML = '<div class="player"><div class="pl-frame"><div class="pl-host"></div></div></div>';
    const stage = IBF.Stage(app.querySelector('.pl-host'), {
      grain: Q.get('grain') || 'static',
      grainOpacity: Q.has('grainOpacity') ? +Q.get('grainOpacity') : 0.03
    });
    stage.setResolution(1);
    stage.setQuality(1);
    const settle = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    window.__meta = { fps: IBF.FPS, frames: IBF.FRAMES, duration: DUR, width: IBF.W, height: IBF.H };
    window.__renderFrame = async (i) => {
      stage.render(i / IBF.FPS);
      await settle();
      return true;
    };
    window.__renderTime = async (t) => {
      stage.render(t);
      await settle();
      return true;
    };
    window.__renderAudio = async (sr) => b64(IBF.encodeWAV(await IBF.renderAudio({ sampleRate: sr || 48000 }), true));
    stage.render(+(Q.get('t') || 0));
    window.__ready = true;
  }

  /* =================== LECTEUR =================== */
  function initPlayer() {
    const app = document.getElementById('app');
    const scenes = IBF.SCENES;
    const touch = matchMedia('(pointer: coarse)').matches;
    const chapHTML = scenes
      .map((s, i) => '<button class="pl-chap" data-i="' + i + '" type="button"><span class="n">' + (i + 1) + '</span><span>' + s.name + '</span><span class="d">' + fmt(s.start) + '</span></button>')
      .join('');
    app.innerHTML =
      '<div class="player compact">' +
      '<div class="pl-view"><div class="pl-frame" role="region" aria-label="Vidéo IBFautomate">' +
      '<div class="pl-host"></div>' +
      '<div class="pl-start"><div class="pl-card"><button class="pl-bigplay" type="button" aria-label="Lancer la vidéo">' + ICON.play + '</button>' +
      '<div class="lbl">' + (touch ? 'Toucher pour lancer' : 'Cliquer pour lancer') + '</div>' +
      '<div class="pl-load"><i></i></div><div class="sub">Préparation du son…</div></div></div>' +
      '</div></div>' +
      '<div class="pl-ctrl">' +
      '<div class="pl-scene"><b></b><span></span></div>' +
      '<div class="pl-bar" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="40">' +
      scenes.map(() => '<div class="pl-seg"><i></i></div>').join('') + '<div class="pl-knob"></div></div>' +
      '<div class="pl-row">' +
      '<button class="pl-btn primary pl-play" type="button" aria-label="Lecture">' + ICON.play + '</button>' +
      '<div class="pl-time">0:00 / 0:40</div><div class="pl-grow"></div>' +
      '<button class="pl-btn pl-listbtn" type="button" aria-label="Scènes">' + ICON.list + '</button>' +
      '<button class="pl-btn pl-mute" type="button" aria-label="Son">' + ICON.sound + '</button>' +
      '<button class="pl-btn pl-full" type="button" aria-label="Plein écran">' + ICON.full + '</button>' +
      '</div>' +
      '<div class="pl-chaps">' + chapHTML + '</div>' +
      '</div>' +
      '<aside class="pl-side">' +
      '<div class="pl-brand"><svg viewBox="-10 -10 552 380"><path d="' + IBF.LOGO.mono + '" fill-rule="evenodd" fill="#1FE07A"/></svg><b>IBF<span>automate</span></b></div>' +
      '<div class="pl-meta">Vidéo promotionnelle · 1920\u00A0×\u00A0820 (21:9) · 30\u00A0i/s · 40\u00A0s<br>Musique et bruitages générés par code</div>' +
      '<h3>Scènes</h3><div class="pl-list">' + chapHTML + '</div>' +
      '<div class="pl-keys"><kbd>Espace</kbd> lecture · <kbd>←</kbd> <kbd>→</kbd> ±1 s · <kbd>M</kbd> son · <kbd>F</kbd> plein écran · <kbd>1</kbd>…<kbd>0</kbd> scènes</div>' +
      '</aside>' +
      '</div>';

    const P = app.querySelector('.player');
    const view = P.querySelector('.pl-view');
    const frame = P.querySelector('.pl-frame');
    const host = P.querySelector('.pl-host');
    const start = P.querySelector('.pl-start');
    const startLbl = start.querySelector('.lbl');
    const startSub = start.querySelector('.sub');
    const loadBar = start.querySelector('.pl-load i');
    const bigPlay = start.querySelector('.pl-bigplay');
    const bar = P.querySelector('.pl-bar');
    const segs = Array.from(bar.querySelectorAll('.pl-seg i'));
    const segEls = Array.from(bar.querySelectorAll('.pl-seg'));
    const knob = bar.querySelector('.pl-knob');
    const btnPlay = P.querySelector('.pl-play');
    const btnMute = P.querySelector('.pl-mute');
    const btnFull = P.querySelector('.pl-full');
    const btnList = P.querySelector('.pl-listbtn');
    const timeEl = P.querySelector('.pl-time');
    const sceneN = P.querySelector('.pl-scene b');
    const sceneT = P.querySelector('.pl-scene span');
    const chaps = Array.from(P.querySelectorAll('.pl-chap'));

    // largeur des segments proportionnelle à la durée des scènes
    segEls.forEach((e, i) => (e.style.flex = String(scenes[i].end - scenes[i].start)));

    const stage = IBF.Stage(host);

    /* ---------- Mise en page adaptative ---------- */
    let mode = '';
    // Intégré dans un site (iframe) ou ?embed : la vidéo occupe tout le cadre, sans panneau latéral
    const EMBED = /[?&]embed/.test(location.search) || window.self !== window.top;
    let immersive = false;
    let scale = 1;
    function layout() {
      const W = window.innerWidth, H = window.innerHeight;
      let m;
      if (immersive || EMBED) m = 'immersive compact';
      else if (W >= 980 && H >= 560) m = 'wide';
      else if (W > H && H < 560) m = 'landscape';
      else if (W >= 620 && H >= 700) m = 'medium';
      else m = 'compact';
      if (m !== mode) {
        mode = m;
        P.classList.remove('compact', 'landscape', 'wide', 'medium', 'immersive');
        m.split(' ').forEach((c) => P.classList.add(c));
      }
      const r = view.getBoundingClientRect();
      const cs = getComputedStyle(view);
      const aw = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      scale = Math.max(0.05, Math.min(aw / IBF.W, ah / IBF.H));
      frame.style.width = Math.floor(IBF.W * scale) + 'px';
      frame.style.height = Math.floor(IBF.H * scale) + 'px';
      host.style.transform = 'scale(' + scale + ')';
      stage.setResolution(scale * (window.devicePixelRatio || 1) * (quality < 1 ? 0.75 : 1));
      needRender = true;
    }

    /* ---------- Son : rendu hors ligne puis lecture synchronisée ---------- */
    const A = { ctx: null, gain: null, buf: null, src: null, t0: 0, off: 0, ready: false, failed: false, muted: false };
    IBF.renderAudio({
      sampleRate: 48000,
      onProgress: (p) => {
        loadBar.style.width = Math.round(p * 100) + '%';
        startSub.textContent = 'Préparation du son… ' + Math.round(p * 100) + ' %';
      }
    }).then(
      (buf) => {
        A.buf = buf;
        A.ready = true;
        startSub.textContent = 'Vidéo 40 s · son activé';
        loadBar.parentNode.style.visibility = 'hidden';
        if (playing) startAudio(now());
      },
      () => {
        A.failed = true;
        startSub.textContent = 'Son indisponible sur ce navigateur';
        loadBar.parentNode.style.visibility = 'hidden';
      }
    );
    function ensureCtx() {
      if (!A.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          A.ctx = new AC({ latencyHint: 'playback' });
        } catch (e) {
          A.ctx = new AC();
        }
        A.gain = A.ctx.createGain();
        A.gain.gain.value = A.muted ? 0 : 1;
        A.gain.connect(A.ctx.destination);
      }
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'playback'; // iPhone : son même en mode silencieux
      } catch (e) {
        /* optionnel */
      }
      if (A.ctx.state === 'suspended') A.ctx.resume();
    }
    function startAudio(t) {
      stopAudio();
      if (!A.ctx || !A.buf || t >= DUR) return;
      const s = A.ctx.createBufferSource();
      s.buffer = A.buf;
      s.connect(A.gain);
      A.t0 = A.ctx.currentTime + 0.05;
      A.off = t;
      s.start(A.t0, t);
      A.src = s;
    }
    function stopAudio() {
      if (A.src) {
        try {
          A.src.stop();
        } catch (e) {
          /* déjà arrêté */
        }
        A.src.disconnect();
        A.src = null;
      }
    }

    /* ---------- Horloge ---------- */
    let playing = false;
    let tPos = Q.has('t') ? +Q.get('t') : 0;
    let perf0 = 0, perfT = 0;
    const POSTER = Q.has('t') ? tPos : 6.7; // image d'accueil : le logo
    let started = false;
    function now() {
      if (!playing) return tPos;
      if (A.src && A.ctx) return Math.max(A.off, A.off + (A.ctx.currentTime - A.t0));
      return perfT + (performance.now() - perf0) / 1000;
    }
    function play() {
      if (!started) {
        started = true;
        start.classList.add('hidden');
        if (!Q.has('t')) tPos = 0;
      }
      if (tPos >= DUR - 0.03) tPos = 0;
      ensureCtx();
      playing = true;
      perf0 = performance.now();
      perfT = tPos;
      if (A.ready) startAudio(tPos);
      start.classList.add('hidden');
      poke();
      syncButtons();
    }
    function pause() {
      tPos = now();
      playing = false;
      stopAudio();
      syncButtons();
      poke();
    }
    function toggle() {
      playing ? pause() : play();
    }
    function seek(t) {
      t = Math.max(0, Math.min(DUR, t));
      if (!started) {
        started = true;
        start.classList.add('hidden');
      }
      tPos = t;
      if (playing) {
        perf0 = performance.now();
        perfT = t;
        if (A.ready) startAudio(t);
      }
      needRender = true;
      poke();
    }
    function ended() {
      playing = false;
      stopAudio();
      tPos = DUR;
      startLbl.textContent = 'Revoir';
      bigPlay.innerHTML = ICON.replay;
      bigPlay.setAttribute('aria-label', 'Revoir la vidéo');
      startSub.textContent = '';
      start.classList.remove('hidden');
      started = true;
      syncButtons();
    }
    function syncButtons() {
      btnPlay.innerHTML = playing ? ICON.pause : ICON.play;
      btnPlay.setAttribute('aria-label', playing ? 'Pause' : 'Lecture');
      btnMute.innerHTML = A.muted ? ICON.muted : ICON.sound;
      btnMute.setAttribute('aria-label', A.muted ? 'Activer le son' : 'Couper le son');
      const fs = !!(document.fullscreenElement || document.webkitFullscreenElement) || immersive;
      btnFull.innerHTML = fs ? ICON.unfull : ICON.full;
    }

    /* ---------- Masquage des contrôles (téléphone) ---------- */
    let idleTimer = 0;
    function poke() {
      P.classList.remove('idle');
      clearTimeout(idleTimer);
      if (playing) idleTimer = setTimeout(() => P.classList.contains('sheet') || P.classList.add('idle'), 2600);
    }

    /* ---------- Interactions ---------- */
    bigPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (tPos >= DUR - 0.03) tPos = 0;
      play();
    });
    start.addEventListener('click', () => play());
    btnPlay.addEventListener('click', toggle);
    btnMute.addEventListener('click', () => {
      A.muted = !A.muted;
      if (A.gain) A.gain.gain.value = A.muted ? 0 : 1;
      syncButtons();
      poke();
    });
    btnList.addEventListener('click', () => {
      P.classList.toggle('sheet');
      poke();
    });
    btnFull.addEventListener('click', toggleFull);
    chaps.forEach((c) =>
      c.addEventListener('click', () => {
        const i = +c.dataset.i;
        seek(scenes[i].start + 0.001);
        if (!playing) play();
        P.classList.remove('sheet');
      })
    );
    // toucher la vidéo : pause / lecture (sur téléphone, un premier toucher réaffiche les contrôles)
    frame.addEventListener('click', (e) => {
      if (!started || e.target.closest('.pl-start')) return;
      if (P.classList.contains('idle')) {
        poke();
        return;
      }
      toggle();
    });
    P.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') poke();
    });
    P.addEventListener('touchstart', poke, { passive: true });

    // barre de progression (souris + tactile)
    let dragging = false;
    function barTime(x) {
      const r = bar.getBoundingClientRect();
      return ((x - r.left) / r.width) * DUR;
    }
    bar.addEventListener('pointerdown', (e) => {
      dragging = true;
      bar.classList.add('drag');
      bar.setPointerCapture(e.pointerId);
      seek(barTime(e.clientX));
    });
    bar.addEventListener('pointermove', (e) => {
      if (dragging) seek(barTime(e.clientX));
    });
    const endDrag = () => {
      dragging = false;
      bar.classList.remove('drag');
    };
    bar.addEventListener('pointerup', endDrag);
    bar.addEventListener('pointercancel', endDrag);

    // clavier
    window.addEventListener('keydown', (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const k = e.key;
      if (k === ' ' || k === 'k' || k === 'K') {
        e.preventDefault();
        toggle();
      } else if (k === 'ArrowLeft') {
        e.preventDefault();
        seek(now() - (e.shiftKey ? 1 / IBF.FPS : 1));
      } else if (k === 'ArrowRight') {
        e.preventDefault();
        seek(now() + (e.shiftKey ? 1 / IBF.FPS : 1));
      } else if (k === 'Home') seek(0);
      else if (k === 'End') seek(DUR);
      else if (k === 'm' || k === 'M') btnMute.click();
      else if (k === 'f' || k === 'F') toggleFull();
      else if (/^[0-9]$/.test(k)) {
        const i = k === '0' ? 9 : +k - 1;
        seek(scenes[i].start + 0.001);
      }
    });

    // plein écran (API standard, ou mode immersif si indisponible : iPhone)
    function toggleFull() {
      const d = document;
      if (d.fullscreenElement || d.webkitFullscreenElement) {
        (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        return;
      }
      if (immersive) {
        immersive = false;
        layout();
        syncButtons();
        return;
      }
      const req = P.requestFullscreen || P.webkitRequestFullscreen;
      if (req) {
        try {
          const r = req.call(P);
          if (r && r.catch) r.catch(() => setImmersive());
        } catch (e) {
          setImmersive();
        }
      } else setImmersive();
    }
    function setImmersive() {
      immersive = true;
      layout();
      syncButtons();
    }
    ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) =>
      document.addEventListener(ev, () => {
        immersive = !!(document.fullscreenElement || document.webkitFullscreenElement);
        layout();
        syncButtons();
      })
    );
    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', () => setTimeout(layout, 150));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && playing) pause();
    });

    /* ---------- Qualité adaptative ---------- */
    let quality = 1;
    let slow = 0, lastF = 0;
    function watchPerf(ts) {
      if (!playing || !lastF) {
        lastF = ts;
        return;
      }
      const dt = ts - lastF;
      lastF = ts;
      if (dt > 30 && dt < 250) slow++;
      else slow = Math.max(0, slow - 0.5);
      if (slow > 40 && quality === 1) {
        quality = 0.5;
        stage.setQuality(0.5);
        layout();
      }
    }

    /* ---------- Boucle d'affichage ---------- */
    let needRender = true;
    let lastT = -1, lastUI = -1, lastScene = -1;
    function frameLoop(ts) {
      requestAnimationFrame(frameLoop);
      watchPerf(ts);
      let t = started ? now() : POSTER;
      if (playing && t >= DUR) {
        t = DUR;
        ended();
      }
      if (needRender || Math.abs(t - lastT) > 1e-4) {
        stage.render(Math.min(t, DUR - 1e-3));
        lastT = t;
        needRender = false;
      }
      const tu = started ? t : 0;
      if (Math.abs(tu - lastUI) > 1e-3) {
        lastUI = tu;
        const p = tu / DUR;
        knob.style.left = p * 100 + '%';
        let si = 0;
        scenes.forEach((s, i) => {
          const f = IBF.clamp((tu - s.start) / (s.end - s.start));
          segs[i].style.width = f * 100 + '%';
          if (tu >= s.start) si = i;
        });
        timeEl.textContent = fmt(tu) + ' / ' + fmt(DUR);
        bar.setAttribute('aria-valuenow', tu.toFixed(1));
        if (si !== lastScene) {
          lastScene = si;
          sceneN.textContent = si + 1 + ' ·';
          sceneT.textContent = scenes[si].name;
          chaps.forEach((c) => c.classList.toggle('on', +c.dataset.i === si));
        }
      }
    }

    layout();
    syncButtons();
    requestAnimationFrame(frameLoop);
    if (Q.has('autoplay')) play();
    window.__player = { play, pause, seek, get t() { return now(); } };
  }

  fontsReady().then(() => (EXPORT ? initExport() : initPlayer()));
})();

</script>
</body>
</html>
