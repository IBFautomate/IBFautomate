<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBFautomate — Vidéo promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   IBFautomate — vidéo promo 21:9 (1920 × 820)

   COULEURS ET TYPOGRAPHIE : TOUT SE RÈGLE ICI, ET SEULEMENT ICI.

   ➜ Pour changer la couleur principale de toute la vidéo (logo, boutons,
     mots d'accent, graphiques, statuts…), modifiez uniquement --primary.
     Toutes les nuances plus claires / plus foncées en sont calculées
     automatiquement : inutile de toucher aux scènes.
   ========================================================================== */
:root {
  /* ---- Couleur principale ---------------------------------------------- */
  --primary: #F06060;          /* corail (inspiré de la vidéo « lois ») */

  /* ---- Couleurs de base ------------------------------------------------ */
  --bg:        #FBFBFC;        /* fond de la vidéo */
  --surface:   #FFFFFF;        /* cartes, fenêtres, boutons clairs */
  --ink:       #15171C;        /* texte principal */
  --ink-soft:  #646A79;        /* texte secondaire */
  --line:      #E8E9EE;        /* bordures fines, séparateurs */
  --success:   #1FA36A;        /* statuts « payé », « signé » */
  --outside:   #0D0E11;        /* bandes autour du cadre 21:9 (hors vidéo) */
  --white:     #FFFFFF;        /* texte sur la couleur principale, pastilles */
  --shade:     17, 19, 26;     /* teinte des ombres (R, G, B) */

  /* ---- Gris de l'interface (CRM, cartes, étiquettes) ------------------- */
  --gray-50:   #FAFAFB;
  --gray-100:  #F5F6F8;
  --gray-150:  #EFF1F5;
  --gray-200:  #E2E3E8;
  --gray-400:  #9297A5;
  --gray-700:  #4A5062;

  /* ---- Typographie (celle d'ibfautomate.com) --------------------------- */
  --font-title: 'Space Grotesk', 'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-text:  'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;

  /* ======================================================================
     Nuances dérivées automatiquement — inutile d'y toucher
     ====================================================================== */
  --primary-light: color-mix(in oklab, var(--primary) 58%, #FFE3CF);
  --primary-dark:  color-mix(in oklab, var(--primary) 70%, #3A0912);
  --primary-deep:  color-mix(in oklab, var(--primary) 40%, #1E050B);
  --primary-soft:  color-mix(in oklab, var(--primary) 10%, #FFFFFF);
  --primary-soft2: color-mix(in oklab, var(--primary) 20%, #FFFFFF);
  --primary-a08:   color-mix(in srgb, var(--primary) 8%, transparent);
  --primary-a15:   color-mix(in srgb, var(--primary) 15%, transparent);
  --primary-a30:   color-mix(in srgb, var(--primary) 30%, transparent);
  --primary-a50:   color-mix(in srgb, var(--primary) 50%, transparent);
  --success-soft:  color-mix(in oklab, var(--success) 12%, #FFFFFF);
  --ink-a06:       color-mix(in srgb, var(--ink) 6%, transparent);
  --grid:          color-mix(in srgb, var(--ink) 5%, transparent);

  --shadow-1: 0 1px 2px rgba(var(--shade), .06), 0 4px 14px rgba(var(--shade), .05);
  --shadow-2: 0 1px 2px rgba(var(--shade), .05), 0 10px 26px rgba(var(--shade), .07), 0 34px 64px -20px rgba(var(--shade), .18);
  --shadow-3: 0 2px 6px rgba(var(--shade), .05), 0 24px 54px rgba(var(--shade), .10), 0 70px 130px -34px rgba(var(--shade), .28);
  --shadow-primary: 0 14px 34px -8px var(--primary-a50), 0 3px 8px var(--primary-a30);

  /* Logo (dégradés calculés depuis --primary) */
  --logo-1: var(--primary-light);   /* reflet clair (haut / gauche) */
  --logo-2: var(--primary);
  --logo-3: var(--primary-dark);
  --logo-4: var(--primary-deep);    /* ombre (bas / droite) */
  --logo-text: color-mix(in oklab, var(--ink) 86%, var(--primary));
  --logo-dash: color-mix(in oklab, var(--ink) 80%, var(--primary));
}

</style>
<style>
/* ==========================================================================
   Styles des scènes — aucune couleur en dur ici : tout vient de theme.css
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--outside); }
body {
  font-family: var(--font-text); color: var(--ink);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision; user-select: none;
}
body.nocursor, body.nocursor * { cursor: none !important; }

/* ---------- Cadre 21:9 ---------- */
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 820px;
  overflow: hidden; background: var(--bg); transform-origin: 0 0; isolation: isolate;
}
.scene { position: absolute; inset: 0; display: none; perspective: 1700px; perspective-origin: 50% 50%; }
.abs { position: absolute; }
.fill { position: absolute; inset: 0; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.p3d { transform-style: preserve-3d; }

/* ---------- Fond ---------- */
#bg { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
#bg .grid {
  position: absolute; inset: -64px;
  background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 62% 70% at 50% 46%, #000 20%, transparent 76%);
          mask-image: radial-gradient(ellipse 62% 70% at 50% 46%, #000 20%, transparent 76%);
}
#bg .blob {
  position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; margin: -500px 0 0 -500px;
  border-radius: 50%; background: radial-gradient(closest-side, var(--primary-a15), transparent);
}
#bg .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 95% at 50% 45%, transparent 58%, rgba(var(--shade), .06)); }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .045; mix-blend-mode: multiply; background-size: 256px 256px; z-index: 50; }
#flash { position: absolute; inset: 0; pointer-events: none; background: var(--surface); opacity: 0; z-index: 40; }

/* ---------- Textes ---------- */
.txt { font-family: var(--font-title); font-weight: 700; letter-spacing: -.038em; line-height: 1.03; color: var(--ink); }
.txt .ln { display: block; white-space: nowrap; }
.txt .w { display: inline-block; white-space: pre; }
.t-xxl { font-size: 156px; }
.t-xl  { font-size: 128px; }
.t-lg  { font-size: 112px; }
.t-md  { font-size: 96px; }
.t-sm  { font-size: 78px; }
.t-xs  { font-size: 68px; }
.t-need { font-size: 80px; transition: color .28s ease; }
.t-need.hot { color: var(--primary); }
.t-soft { color: var(--ink-soft); font-weight: 600; }
.acc { color: var(--primary); position: relative; display: inline-block; white-space: nowrap; }
.ul { position: absolute; left: 0; top: 100%; overflow: visible; pointer-events: none; }
.ul path { fill: none; stroke: var(--primary); stroke-linecap: round; stroke-linejoin: round; }

.tag {
  display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 22px 0 18px;
  border-radius: 999px; background: var(--surface); color: var(--ink);
  font: 600 19px/1 var(--font-text); letter-spacing: .005em; white-space: nowrap;
  box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line);
}
.tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 5px var(--primary-a15); }

/* ---------- Icônes ---------- */
.ico { width: 1em; height: 1em; display: block; flex: none; }

/* ---------- Tuiles (scènes 1-2) ---------- */
.tile {
  position: absolute; left: 0; top: 0; width: 96px; height: 96px; border-radius: 28px;
  background: color-mix(in oklab, var(--primary) calc(var(--hl, 0) * 100%), var(--surface));
  color: color-mix(in oklab, var(--white) calc(var(--hl, 0) * 100%), var(--primary));
  box-shadow: var(--shadow-2), inset 0 0 0 1px rgba(var(--shade), .035);
  display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 42px; overflow: hidden;
}
.tile-lab { font: 700 30px/1 var(--font-title); letter-spacing: -.02em; color: var(--white); white-space: nowrap; width: 0; overflow: hidden; }

/* ---------- Cartes « besoins » ---------- */
.stack { position: absolute; left: 1120px; top: 150px; width: 660px; height: 520px; transform-style: preserve-3d; }
.stack-in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-13deg) rotateX(5deg); }
.ncard {
  position: absolute; left: 0; width: 660px; height: 106px; border-radius: 24px; background: var(--surface);
  box-shadow: var(--shadow-2), inset 0 0 0 1px rgba(var(--shade), .04);
  display: flex; align-items: center; gap: 22px; padding: 0 26px 0 22px;
}
.ncard .nic { width: 60px; height: 60px; border-radius: 18px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 30px; flex: none; }
.ncard .ntx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ncard .ntx b { font: 600 25px/1.1 var(--font-title); letter-spacing: -.015em; color: var(--ink); }
.ncard .ntx small { font: 500 17px/1.2 var(--font-text); color: var(--ink-soft); }
.ncard .nright { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
.ncard time { font: 500 15px/1 var(--font-text); color: var(--ink-soft); }
.ping { position: absolute; left: -7px; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--surface); }
.ping::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--primary); opacity: var(--pp, 0); transform: scale(calc(1 + var(--ps, 0) * 1.6)); }

.pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 999px; font: 600 15px/1 var(--font-text); white-space: nowrap; }
.pill .ico { font-size: 15px; }
.pill.hot  { background: var(--primary); color: var(--white); }
.pill.warn { background: var(--primary-soft2); color: var(--primary-dark); }
.pill.soft { background: var(--gray-150); color: var(--ink-soft); }
.pill.ok   { background: var(--success-soft); color: var(--success); }
.pill.sent { background: var(--gray-150); color: var(--gray-700); }
.pill.draft{ background: var(--gray-100); color: var(--gray-400); }
.pill.late { background: var(--primary-soft2); color: var(--primary-dark); }
.pill.auto { background: var(--primary); color: var(--white); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- Puces « bien d'autres » ---------- */
.chip {
  position: absolute; left: 0; top: 0; height: 74px; padding: 0 30px 0 14px; border-radius: 999px; background: var(--surface);
  box-shadow: var(--shadow-2), inset 0 0 0 1px rgba(var(--shade), .04);
  display: flex; align-items: center; gap: 14px; white-space: nowrap; font: 600 25px/1 var(--font-title); letter-spacing: -.012em; color: var(--ink);
}
.chip .ci { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; }

/* ---------- Logo ---------- */
.logo { position: absolute; width: 420px; height: 420px; }
.logo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.shock { position: absolute; left: 0; top: 0; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; border: 3px solid var(--primary); }

/* ---------- Hub « centralisé » ---------- */
.hub {
  position: absolute; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 48px; background: var(--surface);
  box-shadow: var(--shadow-3), inset 0 0 0 1px rgba(var(--shade), .04); display: flex; align-items: center; justify-content: center;
}
.hub .logo { position: relative; width: 150px; height: 150px; }
.sat {
  position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 28px; background: var(--surface);
  box-shadow: var(--shadow-2), inset 0 0 0 1px rgba(var(--shade), .04); color: var(--primary); font-size: 40px; display: flex; align-items: center; justify-content: center;
}
.sat small { position: absolute; top: 104px; left: 50%; transform: translateX(-50%); font: 600 17px/1 var(--font-text); color: var(--ink-soft); white-space: nowrap; }
.links { position: absolute; inset: 0; overflow: visible; }
.links path { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; opacity: .55; }
.links circle { fill: var(--primary); }

/* ---------- Interrupteur ---------- */
.tcard {
  position: absolute; width: 600px; height: 236px; border-radius: 34px; background: var(--surface);
  box-shadow: var(--shadow-3), inset 0 0 0 1px rgba(var(--shade), .04); padding: 44px 46px; display: flex; align-items: center; justify-content: space-between;
}
.tcard b { display: block; font: 700 42px/1 var(--font-title); letter-spacing: -.03em; color: var(--ink); }
.tcard small { display: block; margin-top: 14px; font: 500 21px/1.2 var(--font-text); color: var(--ink-soft); }
.tcard .state { margin-top: 22px; font: 600 19px/1 var(--font-text); display: flex; align-items: center; gap: 9px; color: var(--ink-soft); }
.tcard .state i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.sw { position: relative; width: 150px; height: 82px; border-radius: 999px; background: var(--gray-200); box-shadow: inset 0 2px 5px rgba(var(--shade), .10); flex: none; }
.sw .fillc { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, var(--primary-light), var(--primary) 55%, var(--primary-dark)); opacity: 0; }
.sw .knob { position: absolute; left: 8px; top: 8px; width: 66px; height: 66px; border-radius: 50%; background: var(--white); box-shadow: 0 4px 12px rgba(var(--shade), .22), 0 1px 2px rgba(var(--shade), .2); }
.sw .glow { position: absolute; inset: -14px; border-radius: 999px; box-shadow: 0 0 0 0 var(--primary-a30); }

/* ---------- Curseur ---------- */
.cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; z-index: 30; pointer-events: none; filter: drop-shadow(0 6px 10px rgba(var(--shade), .25)); }
.ripple { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid var(--primary); opacity: 0; z-index: 29; }

/* ---------- CRM ---------- */
.crm-wrap { position: absolute; left: 1240px; top: 410px; width: 0; height: 0; transform-style: preserve-3d; }
.crm {
  position: absolute; left: -740px; top: -410px; width: 1480px; height: 820px; border-radius: 28px; overflow: hidden;
  background: var(--surface); box-shadow: var(--shadow-3), 0 0 0 1px rgba(var(--shade), .06);
  display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 54px 1fr; font-family: var(--font-text);
}
.crm-bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 9px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--gray-50); }
.crm-bar i { width: 13px; height: 13px; border-radius: 50%; background: var(--gray-200); }
.crm-bar span { margin-left: auto; margin-right: auto; font: 500 15px/1 var(--font-text); color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.crm-bar span .ico { font-size: 15px; }
.crm-side { background: var(--gray-50); border-right: 1px solid var(--line); padding: 26px 18px; display: flex; flex-direction: column; gap: 6px; }
.crm-brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; font: 700 21px/1 var(--font-title); letter-spacing: -.02em; }
.crm-brand .logo { position: relative; width: 42px; height: 42px; }
.crm-side a { display: flex; align-items: center; gap: 13px; height: 46px; padding: 0 14px; border-radius: 13px; font: 500 16px/1 var(--font-text); color: var(--gray-700); }
.crm-side a .ico { font-size: 19px; color: var(--gray-400); }
.crm-side a.on { background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }
.crm-side a.on .ico { color: var(--primary); }
.crm-side a em { margin-left: auto; font: 700 12px/1 var(--font-text); font-style: normal; color: var(--white); background: var(--primary); border-radius: 999px; padding: 5px 8px; }
.crm-user { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 10px; border-top: 1px solid var(--line); }
.crm-user b { display: block; font: 600 15px/1.2 var(--font-text); }
.crm-user small { font: 500 13px/1.2 var(--font-text); color: var(--ink-soft); }
.av { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 13px/1 var(--font-text); background: var(--gray-150); color: var(--gray-700); flex: none; }
.av.c { background: var(--primary-soft2); color: var(--primary-dark); }
.crm-main { padding: 30px 34px 0; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.crm-head { display: flex; align-items: center; justify-content: space-between; }
.crm-head h3 { font: 700 34px/1 var(--font-title); letter-spacing: -.03em; }
.crm-head small { display: block; margin-top: 8px; font: 500 15px/1 var(--font-text); color: var(--ink-soft); }
.crm-tools { display: flex; align-items: center; gap: 14px; }
.search { width: 290px; height: 46px; border-radius: 13px; background: var(--gray-100); display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 500 15px/1 var(--font-text); color: var(--gray-400); }
.search .ico { font-size: 18px; }
.autob { height: 46px; border-radius: 13px; padding: 0 10px 0 16px; display: flex; align-items: center; gap: 12px; font: 600 15px/1 var(--font-text); background: var(--primary-soft); color: var(--primary-dark); }
.msw { position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--primary); }
.msw::after { content: ''; position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(var(--shade), .2); }
.bellb { position: relative; width: 46px; height: 46px; border-radius: 13px; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--gray-700); }
.bellb em { position: absolute; right: 11px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--gray-100); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.kpi { position: relative; height: 118px; border-radius: 18px; border: 1px solid var(--line); padding: 18px 20px; background: var(--surface); overflow: hidden; }
.kpi small { font: 500 15px/1 var(--font-text); color: var(--ink-soft); }
.kpi b { display: block; margin-top: 12px; font: 700 40px/1 var(--font-title); letter-spacing: -.03em; font-variant-numeric: tabular-nums; transform-origin: 0 60%; }
.kpi .delta { position: absolute; left: 20px; bottom: 16px; font: 600 13px/1 var(--font-text); color: var(--success); }
.kpi .delta.p { color: var(--primary-dark); }
.kpi svg { position: absolute; right: 16px; bottom: 18px; width: 108px; height: 46px; overflow: visible; }
.kpi svg path { fill: none; stroke: var(--primary); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.kpi.hi { border-color: var(--primary-a30); background: linear-gradient(160deg, var(--primary-soft), var(--surface) 70%); box-shadow: 0 10px 30px -14px var(--primary-a50); }
.crm-body { display: grid; grid-template-columns: 1fr 380px; gap: 18px; flex: 1; min-height: 0; }
.panel { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 20px 22px; position: relative; overflow: hidden; }
.ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ph h4 { font: 700 20px/1 var(--font-title); letter-spacing: -.02em; }
.ph small { font: 500 14px/1 var(--font-text); color: var(--ink-soft); }
.tr { position: relative; display: grid; grid-template-columns: 1.45fr 1.05fr 1.1fr .8fr 1fr; align-items: center; gap: 12px; height: 60px; padding: 0 10px; border-radius: 12px; font: 500 15px/1.2 var(--font-text); color: var(--gray-700); }
.tr.th { height: 36px; font: 600 12px/1 var(--font-text); letter-spacing: .07em; text-transform: uppercase; color: var(--gray-400); border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 4px; }
.tr .hl { position: absolute; inset: 0; border-radius: 12px; background: var(--primary-soft); opacity: 0; }
.tr > * { position: relative; }
.tr .cl { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tr .cl b { display: block; font: 600 15px/1.2 var(--font-text); color: var(--ink); white-space: nowrap; }
.tr .cl small { font: 500 12.5px/1.2 var(--font-text); color: var(--ink-soft); }
.tr .doc { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tr .doc .ico { font-size: 17px; color: var(--primary); }
.tr .amt { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tr .st { display: flex; }
.tr .st .pill { height: 30px; font-size: 13.5px; padding: 0 12px; transform-origin: 20% 50%; }
.feed { position: relative; height: 420px; }
.fi { position: absolute; left: 0; right: 0; top: 0; height: 66px; display: flex; align-items: center; gap: 13px; border-radius: 14px; padding: 0 8px; }
.fi .fic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; background: var(--gray-150); color: var(--gray-700); }
.fi .fic.hot { background: var(--primary); color: var(--white); box-shadow: 0 6px 14px -4px var(--primary-a50); }
.fi .fic.ok { background: var(--success-soft); color: var(--success); }
.fi .fic.n { background: var(--primary-soft); color: var(--primary); }
.fi div { flex: 1; min-width: 0; }
.fi b { display: block; font: 600 15px/1.2 var(--font-text); color: var(--ink); white-space: nowrap; }
.fi small { display: block; margin-top: 3px; font: 500 12.5px/1.2 var(--font-text); color: var(--ink-soft); white-space: nowrap; }

'use strict';

const W = 1920, H = 820, DURATION = 40;

  s1: 0, s2: 2, s3: 4, s3b: 8, s4: 10, s5a: 13, s5b: 14.5,
  s6: 16, s6b: 18, s6c: 20, s6d: 22,
  s7: 24, steps: [25.5, 27.5, 29.5], overview: 31,
  s8a: 32, s8b: 33.5, s9: 36,
  needs: [4.12, 5, 6, 7],          // apparition des 4 besoins
  chips: 8.12, chipStep: 0.125,    // « bien d'autres » (une puce par double croche)
  toggle: 15,                      // clic sur l'interrupteur
  status: [18.45, 18.85, 19.25],   // statuts qui changent dans le CRM
  feed: [20.4, 20.9, 21.4],        // relance → relancé → payé
  checks: [31.25, 31.45, 31.65],   // validation des 3 étapes
  ctaClick: 37.9,                  // clic sur le bouton final
  cuts: [2, 4, 8, 13, 14.5, 16, 18, 20, 22, 25.5, 27.5, 29.5, 31, 33.5], // transitions (souffles)
};

/* ---- Outils mathématiques ---- */
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const Ease = {
  lin: p => p,
  o2: p => 1 - (1 - p) * (1 - p),
  o3: p => 1 - Math.pow(1 - p, 3),
  o4: p => 1 - Math.pow(1 - p, 4),
  i2: p => p * p,
  i3: p => p * p * p,
  io2: p => (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
  io3: p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  oX: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  iX: p => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  ioX: p => (p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2),
  oB: p => { const s = 1.6; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); },

const seg = (t, a, b, e = Ease.o3) => e(prog(t, a, b));
/* 0 → 1 → 0 sur [a, a + d] */
const bump = (t, a, d) => Math.sin(prog(t, a, a + d) * Math.PI);
/* Générateur pseudo-aléatoire déterministe (même vidéo à chaque lecture) */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

/* ---- DOM ---- */
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function frag(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function at(e, x, y) { e.style.left = x + 'px'; e.style.top = y + 'px'; return e; }

/* Applique une transformation (avec cache pour éviter les écritures inutiles) */
function put(e, o) {
  let s = '';

  if (o.rx) s += ` rotateX(${o.rx.toFixed(3)}deg)`;
  if (o.ry) s += ` rotateY(${o.ry.toFixed(3)}deg)`;
  if (o.rz) s += ` rotate(${o.rz.toFixed(3)}deg)`;
  if (o.s != null && Math.abs(o.s - 1) > 1e-4) s += ` scale(${o.s.toFixed(4)})`;
  if (o.sx != null || o.sy != null) s += ` scale(${(o.sx ?? 1).toFixed(4)},${(o.sy ?? 1).toFixed(4)})`;
  if (e._tf !== s) { e.style.transform = s || 'none'; e._tf = s; }

    const v = o.o < .002 ? 0 : o.o > .998 ? 1 : +o.o.toFixed(3);
    if (e._o !== v) { e.style.opacity = v; e.style.visibility = v === 0 ? 'hidden' : 'visible'; e._o = v; }

/* Entrée / sortie d'un élément.
   A = entrée {d durée, x, y, z, s, rx, ry, rz, blur, e easing, bx/by décalage permanent}
   B = sortie {d, x, y, z, s, rx, ry, rz, blur, e} — tout est interpolé depuis t. */
function io(e, t, tin, tout, A = {}, B = {}) {
  const pa = (A.e || Ease.oX)(prog(t, tin, tin + (A.d ?? .6)));
  const pb = tout == null ? 0 : (B.e || Ease.i2)(prog(t, tout, tout + (B.d ?? .26)));
  const a = 1 - pa;
  put(e, {
    x: (A.x || 0) * a + (B.x || 0) * pb + (A.bx || 0),
    y: (A.y ?? 34) * a + (B.y ?? -18) * pb + (A.by || 0),
    z: (A.z || 0) * a + (B.z || 0) * pb + (A.bz || 0),
    rx: (A.rx || 0) * a + (B.rx || 0) * pb, ry: (A.ry || 0) * a + (B.ry || 0) * pb, rz: (A.rz || 0) * a + (B.rz || 0) * pb,

    o: pa * (1 - pb), blur: (A.blur ?? 10) * a + (B.blur ?? 8) * pb,
  });
  return pa * (1 - pb);
}
/* Apparition mot à mot */
function words(ws, t, start, stagger, A, tout, B, outStagger = 0) {
  ws.forEach((w, i) => io(w, t, start + i * stagger, tout == null ? null : tout + i * outStagger, A, B));
}

/* ---- Textes ----
   txt("Une solution|{sur mesure}")
     |      = retour à la ligne
     [mot]  = mot d'accent (couleur principale)
     {mot}  = mot d'accent + soulignement dessiné à la main */
function txt(src, cls) {
  const box = el('div', 'txt ' + (cls || ''));
  box.words = []; box.uls = [];
  src.split('|').forEach(line => {
    const ln = el('div', 'ln'); box.appendChild(ln);
    const re = /\{[^}]*\}|\[[^\]]*\]|\s+|[^\s[{]+/g; let m;
    while ((m = re.exec(line))) {
      const tok = m[0];
      if (/^\s+$/.test(tok)) { ln.appendChild(document.createTextNode(' ')); continue; }
      if (tok[0] === '{' || tok[0] === '[') {
        const acc = el('span', 'acc'); ln.appendChild(acc);
        tok.slice(1, -1).split(' ').forEach((wd, k) => {
          if (k) acc.appendChild(document.createTextNode(' '));
          const w = el('span', 'w', esc(wd)); acc.appendChild(w); box.words.push(w);
        });
        if (tok[0] === '{') box.uls.push({ acc });
      } else { const w = el('span', 'w', esc(tok)); ln.appendChild(w); box.words.push(w); }
    }
  });
  return box;
}
/* Construit les soulignements une fois les polices chargées (mesure réelle) */
function layoutUnderlines(root) {
  root.querySelectorAll('.txt').forEach(box => (box.uls || []).forEach(u => {
    const w = u.acc.offsetWidth, fs = parseFloat(getComputedStyle(u.acc).fontSize);
    const h = fs * .26, sw = Math.max(5, fs * .072);
    if (u.svg) u.svg.remove();
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'ul'); svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.style.marginTop = (-fs * .02) + 'px';
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${sw} ${h * .72} C ${w * .28} ${h * .30}, ${w * .62} ${h * .12}, ${w - sw} ${h * .36}`);
    p.setAttribute('stroke-width', sw);
    svg.appendChild(p); u.acc.appendChild(svg);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len + ' ' + (len + 40); p.style.strokeDashoffset = len; p.style.visibility = 'hidden';
    u.svg = svg; u.path = p; u.len = len; u.last = null;
  }));
}
/* Dessine le soulignement n° i d'un texte entre a et b */
function ul(box, i, t, a, b, out) {
  const u = box.uls && box.uls[i]; if (!u || !u.path) return;
  let p = seg(t, a, b, Ease.io3);
  if (out != null) p *= 1 - seg(t, out, out + .2, Ease.i2);
  const v = (u.len * (1 - p)).toFixed(1);
  if (u.last !== v) { u.path.style.strokeDashoffset = v; u.path.style.visibility = p > .002 ? 'visible' : 'hidden'; u.last = v; }
}

<script>
/* ==========================================================================
   music.js — musique générée par code (Web Audio API)
   120 BPM, ré majeur. Chaque coupe de la vidéo tombe sur un temps ;
   les impacts, clics et sons d'interface sont placés sur les repères TL
   (engine.js) : la musique suit toujours le rythme de l'image.
   La bande son est calculée une fois (OfflineAudioContext, quelques
   secondes) puis jouée d'un bloc : aucune dérive entre le son et l'image.
   ========================================================================== */
'use strict';

const Music = (() => {
  const SR = 44100, LEN = DURATION + 0.6, STEP = 0.125;      // double croche = 0,125 s
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const inR = (t, a, b) => t >= a - 1e-6 && t < b - 1e-6;

  /* Accords (une mesure = 2 s) : basse + notes de la nappe */
  const CH = {
    G:  { r: 43, n: [55, 59, 62, 66] },   // Sol maj7
    D:  { r: 38, n: [57, 62, 66, 69] },   // Ré
    Bm: { r: 35, n: [59, 62, 66, 69] },   // Si m7
    A:  { r: 33, n: [57, 61, 64, 69] },   // La
    As: { r: 33, n: [57, 62, 64, 69] },   // La sus4
  };
  const PROG = ['G', 'D', 'Bm', 'A', ['G', 'As'], 'D', 'Bm', 'A', 'G', 'D', 'Bm', 'A', 'G', 'D', 'Bm', 'A', 'G', 'As', 'D', 'D'];
  /* Motif mélodique (positions en doubles croches dans la mesure) */
  const MOTIF = {
    D:  [[0, 78], [3, 81], [6, 83], [8, 81], [10, 78], [12, 76], [14, 78]],
    Bm: [[0, 74], [3, 78], [6, 81], [8, 78], [12, 76]],
    A:  [[0, 76], [3, 73], [6, 76], [8, 78], [10, 81], [12, 85]],
    G:  [[0, 74], [3, 78], [6, 79], [8, 78], [12, 74], [14, 76]],
  };
  /* Sections (en secondes) */
  const KICK  = t => inR(t, 4, 9.5) || inR(t, 10, 31.75) || inR(t, 36, 38);
  const CLAP  = t => inR(t, 6, 9.5) || inR(t, 10, 31.75) || inR(t, 36, 38);
  const HATS  = t => inR(t, 2, 9.75) || inR(t, 10, 31.9) || inR(t, 34, 35.75) || inR(t, 36, 38);
  const BASS  = t => inR(t, 4, 9.75) || inR(t, 10, 32) || inR(t, 34, 35.75) || inR(t, 36, 38);
  const ARP16 = t => inR(t, 4, 32) || inR(t, 34, 35.75) || inR(t, 36, 38);
  const ARP8  = t => inR(t, 0, 4) || inR(t, 32, 34);
  const LEAD  = t => inR(t, 10, 16) || inR(t, 24, 31.75) || inR(t, 36, 38);

  async function render() {
    const ac = new OfflineAudioContext(2, Math.ceil(SR * LEN), SR);
    const rnd = rng(20261005);
    const filt = (type, f, q = .7) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
    const gainN = v => { const g = ac.createGain(); g.gain.value = v; return g; };
    const env = (p, t, a, peak, dec) => { p.setValueAtTime(.0001, t); p.exponentialRampToValueAtTime(peak, t + a); p.exponentialRampToValueAtTime(.0001, t + a + dec); };

    /* ---- Sortie : bus → compresseur doux → limiteur ---- */
    const bus = gainN(.5);
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 2.2; comp.attack.value = .01; comp.release.value = .25;
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .002; lim.release.value = .1;
    const out = gainN(1);
    bus.connect(comp); comp.connect(lim); lim.connect(out); out.connect(ac.destination);
    out.gain.setValueAtTime(1, 39.05); out.gain.linearRampToValueAtTime(0, 39.98);

    /* Réverbération (réponse impulsionnelle générée) et écho pointé 3/16 */
    const ir = ac.createBuffer(2, Math.floor(SR * 2.4), SR);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) { const x = i / d.length; d[i] = (rnd() * 2 - 1) * Math.pow(1 - x, 2.8) * Math.min(1, i / (SR * .006)); } }
    const revSend = gainN(1), rev = ac.createConvolver(); rev.buffer = ir;
    const revHp = filt('highpass', 260); revSend.connect(rev); rev.connect(revHp); revHp.connect(gainN(.5)).connect(bus);
    const dlySend = gainN(1), dl = ac.createDelay(1); dl.delayTime.value = .375;
    const dfb = gainN(.32), dlp = filt('lowpass', 3800), dhp = filt('highpass', 350);
    dlySend.connect(dl); dl.connect(dlp); dlp.connect(dhp); dhp.connect(dfb); dfb.connect(dl);
    dhp.connect(gainN(.45)).connect(bus);

    /* Bus : batterie, musique (avec pompage sur la grosse caisse), effets */
    const drums = gainN(.85); drums.connect(bus);
    const duck = gainN(1); duck.connect(bus);
    const sfx = gainN(.8); sfx.connect(bus);
    /* Bus partagés (panoramique + envois) : peu de nœuds par note → calcul rapide */
    const mk = (dest, pan, rv, dlv) => {
      const g = gainN(1), p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(dest);
      if (rv) p.connect(gainN(rv)).connect(revSend);
      if (dlv) p.connect(gainN(dlv)).connect(dlySend);
      return g;
    };
    const B = {
      padL: mk(duck, -.4, .32), padR: mk(duck, .4, .32),
      arpL: mk(duck, -.28, .14, .22), arpR: mk(duck, .28, .14, .22),
      soft: mk(duck, 0, .26, .3), lead: mk(duck, 0, .2, .3), leadBell: mk(duck, 0, .25, .2),
      bellL: mk(sfx, -.3, .3, .18), bellC: mk(sfx, 0, .3, .18), bellR: mk(sfx, .3, .3, .18),

<script>

'use strict';

const lcol = (left = 130) => { const c = el('div', 'lcol'); c.style.left = left + 'px'; return c; };

const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
/* Position d'un élément par rapport à un ancêtre (sans les transformations) */

/* ======================================================================

function buildBackground() {

    put(grid, { x: -((t * 10) % 64), y: -((t * 6) % 64) });

function buildGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 256;

/* ======================================================================

  /* ---------- 0 → 4 s : tuiles « sur mesure » (partagées par S1 et S2) ---------- */

        const st = ROWS[i].st; let k = 0; st.forEach((e, j) => { if (t >= e[0]) k = j; });

      put(rip, { x: B[0] + 70, y: B[1] + 6, s: lerp(.2, 1.8, Ease.o3(prog(lt, C, C + .6))), o: .6 * (1 - prog(lt, C, C + .6)) * (lt >= C ? 1 : 0) });

  const updGrain = buildGrain();
  const updFlash = buildFlash();
  return t => { updBg(t); updGrain(t); updFlash(t); };

/* Mesures réelles une fois les polices chargées */
function layoutScenes() {
  SCENES.forEach(s => { s.root.style.display = 'block'; });
  layoutUnderlines(STAGE);
  SCENES.forEach(s => { if (s.layout) s.layout(); });
  SCENES.forEach(s => { s.root.style.display = s.on ? 'block' : 'none'; });
}

/* Dessine l'image au temps t */
let GLOBAL_UPDATE = null;
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  GLOBAL_UPDATE(t);
  for (const s of SCENES) {
    const on = t >= s.t0 && t < s.t1;
    if (on !== s.on) { s.root.style.display = on ? 'block' : 'none'; s.on = on; }
    if (on) s.update(t - s.t0, t);

<script>
/* ==========================================================================
   main.js — lecture, clavier, plein écran, export
   ========================================================================== */
'use strict';
(() => {
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  const startEl = $('start'), statusEl = startEl.querySelector('.status'), hud = $('hud'), hbar = $('hbar'), htime = $('htime'), toastEl = $('toast');
  GLOBAL_UPDATE = buildScenes(stage);
  startEl.querySelector('.logo-slot').replaceWith(makeLogo());

  /* ---- Cadre 21:9 centré, à l'échelle de la fenêtre ---- */
  let VIEW = null;
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = VIEW ? `scale(${VIEW[2] * s}) translate(${-VIEW[0]}px, ${-VIEW[1]}px)`
      : `translate(${((innerWidth - W * s) / 2).toFixed(2)}px, ${((innerHeight - H * s) / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
  }
  addEventListener('resize', fit); fit();
  /* Outils de prévisualisation (console) : __seek(12.5) affiche l'image à 12,5 s ; __view(x, y, zoom) agrandit une zone */
  window.__seek = t => { pause(); pausedAt = clamp(t, 0, DURATION); renderAt(pausedAt); };
  window.__view = (x, y, z) => { VIEW = x == null ? null : [x, y, z]; fit(); };
  window.__state = () => ({ t: +clock().toFixed(3), playing, audio: actx ? actx.state : 'aucun', ready });

  /* ---- Horloge : celle de la carte son quand la musique joue ---- */
  const params = new URLSearchParams(location.search);
  let actx = null, gain = null, buffer = null, src = null;
  let playing = false, pausedAt = params.has('t') ? parseFloat(params.get('t')) || 0 : 0;
  let startAt = 0, startOffset = 0, perfStart = 0, ready = false, started = false, onEnd = null;
  const now = () => performance.now() / 1000;

  function clock() {
    if (!playing) return pausedAt;
    if (src && actx) {
      let ct = actx.currentTime;
      if (actx.getOutputTimestamp) {
        const ts = actx.getOutputTimestamp();
        if (ts.contextTime > 0 && ts.performanceTime > 0) ct = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
      }
      return startOffset + (ct - startAt);
    }
    return startOffset + (now() - perfStart);
  }
  function ensureAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC(); gain = actx.createGain(); gain.connect(actx.destination);
  }
  function stopAudio() { if (src) { try { src.stop(); } catch (e) { /* déjà arrêté */ } src.disconnect(); src = null; } }
  function play(from = pausedAt) {
    from = clamp(from, 0, DURATION);
    if (from >= DURATION - .05) from = 0;
    stopAudio();
    if (actx && buffer) {
      if (actx.state === 'suspended') actx.resume();
      src = actx.createBufferSource(); src.buffer = buffer; src.connect(gain);
      startAt = actx.currentTime + .05; startOffset = from;
      src.start(startAt, Math.min(from, buffer.duration - .01));
    } else { perfStart = now(); startOffset = from; }
    playing = true;
  }
  function pause() { if (!playing) return; pausedAt = clamp(clock(), 0, DURATION); playing = false; stopAudio(); }
  function seek(t) { t = clamp(t, 0, DURATION); if (playing) play(t); else pausedAt = t; }

  /* ---- Boucle d'affichage ---- */
  function frame() {
    let t = clock();
    if (playing && t >= DURATION) {
      t = DURATION; pausedAt = DURATION; playing = false; stopAudio();
      if (onEnd) { const f = onEnd; onEnd = null; f(); }
    }
    renderAt(Math.max(0, t));
    if (hud.classList.contains('on')) { htime.textContent = Math.max(0, t).toFixed(2) + ' s'; if (document.activeElement !== hbar) hbar.value = t; }
    requestAnimationFrame(frame);
  }

  /* ---- Préparation : polices + musique ---- */
  const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 4000))]);
  fontsReady.then(() => { layoutScenes(); renderAt(pausedAt); });
  Promise.all([fontsReady, Music.render().then(b => { buffer = b; }).catch(e => { console.error(e); })]).then(() => {
    ready = true; startEl.classList.remove('busy');
    statusEl.textContent = buffer ? 'Cliquez pour lancer la vidéo' : 'Cliquez pour lancer (musique indisponible sur ce navigateur)';
    if (params.has('play')) { startEl.style.display = 'none'; started = true; play(pausedAt); }
  });
  /* Intégrée dans un site (iframe) ou ?embed : pas de boutons d'export */
  if (params.has('embed') || window.self !== window.top) document.body.classList.add('embed');
  /* Clic sur l'image : pause / reprise */
  stage.addEventListener('click', () => {
    if (!started || rec) return;
    ensureAudio();
    if (playing) { pause(); toast('Pause — cliquez pour reprendre', 1500); } else play();
  });
  if (params.has('t')) startEl.style.display = 'none';
  if (params.has('hud')) hud.classList.add('on');
  requestAnimationFrame(frame);

  function start() {
    if (!ready) return;
    ensureAudio();
    startEl.style.display = 'none'; started = true;
    play(0); idle();
  }
  startEl.addEventListener('click', e => { if (!e.target.closest('button')) start(); });

  /* ---- Curseur masqué pendant la lecture ---- */
  let idleT = 0;
  function idle() { document.body.classList.remove('nocursor'); clearTimeout(idleT); idleT = setTimeout(() => { if (started) document.body.classList.add('nocursor'); }, 1400); }
  addEventListener('mousemove', idle);

  function toast(msg, ms = 3200) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.classList.remove('on'), ms); }

  /* ---- Clavier ---- */
  const JUMPS = [0, TL.s3, TL.s3b, TL.s4, TL.s5a, TL.s6, TL.s7, TL.s8a, TL.s9];
  addEventListener('keydown', e => {
    if (e.target === hbar && e.key.startsWith('Arrow')) return;
    const k = e.key.toLowerCase();
    if (rec && rec.waiting && k === 'enter') { e.preventDefault(); rec.go(); return; }
    if (!started && (k === ' ' || k === 'enter')) { e.preventDefault(); start(); return; }
    if (k === ' ') { e.preventDefault(); ensureAudio(); playing ? pause() : play(); }
    else if (k === 'r') { ensureAudio(); play(0); }
    else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
    else if (k === 'h') hud.classList.toggle('on');
    else if (k === 'm') { if (gain) { gain.gain.value = gain.gain.value > 0 ? 0 : 1; toast(gain.gain.value ? 'Son activé' : 'Son coupé', 1200); } }
    else if (k === 'arrowleft') seek(clock() - (e.shiftKey ? 5 : 1));
    else if (k === 'arrowright') seek(clock() + (e.shiftKey ? 5 : 1));
    else if (/^[1-9]$/.test(k)) { if (!started) { startEl.style.display = 'none'; started = true; ensureAudio(); } seek(JUMPS[+k - 1]); if (!playing) play(JUMPS[+k - 1]); }
  });
  hbar.addEventListener('input', () => seek(parseFloat(hbar.value)));

  /* ---- Musique seule en .wav ---- */
  startEl.querySelector('.wav').addEventListener('click', () => {
    if (!buffer) { toast('La musique est encore en préparation…'); return; }
    const n = buffer.length, ch = buffer.numberOfChannels, sr = buffer.sampleRate, data = new DataView(new ArrayBuffer(44 + n * ch * 2));
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) data.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); data.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); data.setUint32(16, 16, true); data.setUint16(20, 1, true);
    data.setUint16(22, ch, true); data.setUint32(24, sr, true); data.setUint32(28, sr * ch * 2, true); data.setUint16(32, ch * 2, true); data.setUint16(34, 16, true);
    ws(36, 'data'); data.setUint32(40, n * ch * 2, true);
    const chans = [...Array(ch)].map((_, c) => buffer.getChannelData(c));
    for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < ch; c++, o += 2) data.setInt16(o, Math.max(-1, Math.min(1, chans[c][i])) * 32767, true);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'audio/wav' })); a.download = 'IBFautomate-musique.wav'; a.click();
  });

  /* ---- Export vidéo (Chrome / Edge) : capture de cet onglet, recadrée sur le cadre 21:9 ---- */
  let rec = null;
  startEl.querySelector('.rec').addEventListener('click', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) { toast('L’export vidéo nécessite Chrome ou Edge sur ordinateur. Sinon, enregistrez l’écran en plein écran.', 5000); return; }
    if (!ready || !buffer) { toast('Patientez, la musique se prépare…'); return; }
    ensureAudio();
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: false, preferCurrentTab: true, selfBrowserSurface: 'include', surfaceSwitching: 'exclude' });
    } catch (e) { toast('Enregistrement annulé.'); return; }
    const track = stream.getVideoTracks()[0];
    const dest = actx.createMediaStreamDestination(); gain.connect(dest);
    const mixed = new MediaStream([track, ...dest.stream.getAudioTracks()]);
    const types = ['video/mp4;codecs=avc1.640033,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const mr = new MediaRecorder(mixed, { mimeType: mime, videoBitsPerSecond: 24e6, audioBitsPerSecond: 256e3 });
    const chunks = []; mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); try { gain.disconnect(dest); } catch (e) { /* rien */ }
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: mime || 'video/webm' })); a.download = 'IBFautomate-video.' + ext; a.click();
      toast('Vidéo enregistrée : IBFautomate-video.' + ext, 6000); rec = null;
    };
    track.addEventListener('ended', () => { if (mr.state === 'recording') { pause(); mr.stop(); } });
    startEl.style.display = 'none'; hud.classList.remove('on'); started = true; pause(); pausedAt = 0;
    let cropped = false;
    try { if (window.CropTarget && track.cropTo) { await track.cropTo(await CropTarget.fromElement(stage)); cropped = true; } } catch (e) { console.warn(e); }
    rec = {
      waiting: true,
      go: () => {
        rec.waiting = false; document.body.classList.add('nocursor');
        setTimeout(() => { mr.start(200); play(0); onEnd = () => setTimeout(() => mr.stop(), 350); }, 600);
      },
    };
    toast((cropped ? '' : 'Astuce : en plein écran le cadre sera plus net. ') + 'Passez en plein écran (F) puis appuyez sur Entrée pour lancer l’enregistrement.', 8000);
  });
})();

</script>
</body>
</html>
